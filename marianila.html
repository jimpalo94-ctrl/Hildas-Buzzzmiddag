<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria Nila interaktiva quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#EEE7FF; --stage-2:#DCCFFF; --ink:#22123F; --ink-soft:#5E4D86; --panel:#FFFFFF; --panel-2:#F6F1FF; --line:#CDBEF5; --shade:#22123F;
  --c0:#2F6BFF; --c1:#FF8A1F; --c2:#15A85C; --c3:#FFD21F; --on0:#FFFFFF; --on1:#2A1400; --on2:#FFFFFF; --on3:#2A1A00;
  --buzz:#E8213B; --ok:#15A85C; --bad:#E8213B; --go:#13BF62;
  --sea:#BDD3FF; --land:#FFF8EA; --border:#B3A0E6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#1C0E3A; --stage-2:#2F1860; --ink:#FFF4E2; --ink-soft:#BCA9EA; --panel:#2B1857; --panel-2:#241349; --line:#4B3394; --shade:#07021A;
    --sea:#172A61; --land:#3D2D74; --border:#7863C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --stage:#1C0E3A; --stage-2:#2F1860; --ink:#FFF4E2; --ink-soft:#BCA9EA; --panel:#2B1857; --panel-2:#241349; --line:#4B3394; --shade:#07021A;
  --sea:#172A61; --land:#3D2D74; --border:#7863C8;
  color-scheme: dark;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; height:100%; color:var(--ink);
  background:var(--stage);
  background-image:radial-gradient(ellipse 70% 55% at 50% -8%, var(--stage-2), transparent 70%);
  font-family:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{height:100%}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button:focus-visible, input:focus-visible{outline:3px solid var(--c3); outline-offset:3px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

/* ---------- shared bits ---------- */
.disc{
  --pc:#888; display:inline-grid; place-items:center; width:1.9em; height:1.9em; border-radius:50%;
  background:var(--pc); font-size:1em; line-height:1; box-shadow:inset 0 -.14em 0 rgba(0,0,0,.25);
}
.btn{
  border:0; border-radius:999px; padding:.7em 1.5em; font-weight:800; font-size:1.05rem;
  background:var(--ink); color:var(--stage); box-shadow:0 .22em 0 var(--shade);
}
.btn:active{transform:translateY(.15em); box-shadow:0 .07em 0 var(--shade)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--line)}
.shape{display:inline-grid; place-items:center; width:1.5em; height:1.5em; border-radius:.35em; background:rgba(255,255,255,.22); font-size:.8em; flex:none}
.c0{background:var(--c0); color:var(--on0)} .c1{background:var(--c1); color:var(--on1)}
.c2{background:var(--c2); color:var(--on2)} .c3{background:var(--c3); color:var(--on3)}
.c1 .shape,.c3 .shape{background:rgba(0,0,0,.12)}
.muted{color:var(--ink-soft)}

/* ---------- home ---------- */
.home{min-height:100%; display:grid; place-items:center; padding:24px}
.home-in{max-width:520px; width:100%; display:grid; gap:18px; text-align:center}
.logo{font-weight:800; font-size:clamp(40px, 9vw, 100px); line-height:.95; letter-spacing:-.03em; margin:0; text-wrap:balance}
.dots{display:flex; gap:.5em; justify-content:center}
.dots span{width:1.1em; height:1.1em; border-radius:50%; box-shadow:inset 0 -.18em 0 rgba(0,0,0,.25)}
.choice{display:grid; gap:12px; margin-top:8px}
.choice button{
  border:0; border-radius:22px; padding:20px 22px; text-align:left; background:var(--panel);
  box-shadow:0 5px 0 var(--line); display:grid; gap:4px;
}
.choice button b{font-size:1.35rem}
.choice button span{color:var(--ink-soft); font-size:.98rem; line-height:1.35}

/* ---------- TV ---------- */
.tv{height:100%; display:grid; grid-template-rows:auto 1fr auto; padding:2.6vmin 4vmin 2.2vmin; gap:2vmin; font-size:clamp(14px, 2.2vmin, 34px); overflow:hidden}
.tv-top{display:flex; justify-content:space-between; align-items:baseline; gap:2em; min-height:1.4em; color:var(--ink-soft); font-weight:700; font-size:1.15em}
.tv-main{display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3vmin; min-height:0}
.tv-bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:2em}
.strip{display:flex; flex-wrap:wrap; gap:1.2em; align-items:flex-end}
.chip{display:grid; justify-items:center; gap:.25em; font-weight:700; position:relative; transition:transform .25s, opacity .25s}
.chip .disc{font-size:1.5em}
.chip small{font-size:.8em; color:var(--ink-soft); font-weight:700}
.chip.done{transform:translateY(-.5em)}
.chip.done::after{content:"✓"; position:absolute; top:-.3em; right:-.3em; width:1.3em; height:1.3em; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:.8em}
.chip.off{opacity:.35}
.chip.out{opacity:.35; filter:grayscale(1)}
.chip .gain{position:absolute; top:-1.6em; font-weight:800; color:var(--ok); white-space:nowrap; animation:rise .6s ease-out both}
.chip .gain.neg{color:var(--bad)}
@keyframes rise{from{opacity:0; transform:translateY(.6em)} to{opacity:1; transform:none}}
.ctrls{display:flex; gap:.5em; flex-wrap:wrap; justify-content:flex-end}
.ctrls .btn{font-size:.75em; padding:.55em 1.1em}

.question{font-weight:800; font-size:clamp(26px, 5.6vmin, 92px); line-height:1.08; letter-spacing:-.02em; text-align:center; max-width:22ch; margin:0; text-wrap:balance}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:2vmin; width:min(100%, 150vmin)}
.tile{
  border-radius:2.4vmin; padding:2.2vmin 2.6vmin; display:flex; align-items:center; gap:.7em;
  font-weight:800; font-size:clamp(18px, 3.7vmin, 60px); line-height:1.1; min-height:13vmin;
  box-shadow:inset 0 -.6vmin 0 rgba(0,0,0,.22); transition:opacity .35s, transform .35s; position:relative;
}
.tile.dim{opacity:.22}
.tile.right{transform:scale(1.04); box-shadow:inset 0 -.6vmin 0 rgba(0,0,0,.22), 0 0 0 .7vmin var(--ink)}
.tile .pickers{margin-left:auto; font-size:.75em; letter-spacing:.1em}
.status{font-weight:700; font-size:1.3em; text-align:center; min-height:1.3em}
.status.big{font-size:2em; font-weight:800}
.bar{width:min(100%, 150vmin); height:1.6vmin; border-radius:99px; background:var(--panel); overflow:hidden}
.bar i{display:block; height:100%; background:var(--ink); transform-origin:left; border-radius:99px}

.intro{text-align:center; display:grid; gap:2vmin; justify-items:center; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.intro-num{font-weight:700; font-size:1.4em; color:var(--ink-soft)}
.intro-title{font-weight:800; font-size:clamp(40px, 13vmin, 210px); line-height:.9; letter-spacing:-.04em; margin:0}
.intro-desc{font-size:1.5em; max-width:34ch; margin:0; line-height:1.3; text-wrap:balance}
@keyframes pop{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none}}

.lobby{display:grid; justify-items:center; gap:3vmin; text-align:center; width:100%}
.lobby .logo{font-size:clamp(36px, 8.5vmin, 150px); text-shadow:.05em .05em 0 var(--c1); max-width:18ch}
.lobby .dots{font-size:3vmin}
.lead{font-size:1.4em; margin:0; max-width:36ch; line-height:1.3}
.grid-players{display:flex; flex-wrap:wrap; gap:2.4vmin; justify-content:center; min-height:9vmin; align-items:center}
.grid-players .chip .disc{font-size:2.2em}
.seg{display:inline-flex; background:var(--panel); border-radius:999px; padding:.3em; gap:.2em}
.seg button{border:0; background:transparent; padding:.5em 1.2em; border-radius:999px; font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--stage)}
.lobby .start{font-size:1.5em}

.signal{width:min(100%,150vmin); flex:1; max-height:56vmin; border-radius:4vmin; display:grid; place-items:center; text-align:center; font-weight:800; color:#fff}
.signal.wait{background:var(--buzz)} .signal.go{background:var(--go)}
.signal b{font-size:clamp(40px,16vmin,260px); line-height:1; letter-spacing:-.04em}
.signal span{font-size:1.4em; font-weight:700; opacity:.9}

.rows{display:grid; gap:1.2vmin; width:min(100%, 120vmin)}
.rows.many{grid-template-columns:1fr 1fr; gap:.8vmin 2.4vmin; width:min(100%, 170vmin)}
.rows.many .row{font-size:1em; padding:.7vmin 1.6vmin; gap:.7em}
.rows.lots .row{font-size:.86em; padding:.45vmin 1.4vmin}
.strip.many{gap:1.7em .7em; font-size:.8em}
.row{display:grid; grid-template-columns:2.2em auto 1fr auto auto; align-items:center; gap:1em; background:var(--panel); border-radius:2vmin; padding:1vmin 2vmin; font-weight:700; font-size:1.25em}
.row .rank{font-weight:800; color:var(--ink-soft)}
.row .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .val{font-weight:800; font-variant-numeric:tabular-nums}
.row .delta{font-weight:800; color:var(--ok); min-width:4.5em; text-align:right; font-variant-numeric:tabular-nums}
.row .delta.neg{color:var(--bad)}
.row .track{height:1.2vmin; border-radius:99px; background:var(--panel-2); overflow:hidden}
.row .track i{display:block; height:100%; border-radius:99px; background:var(--pc,#888); transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row.first{box-shadow:0 0 0 .5vmin var(--c3)}

.bignum{font-weight:800; font-size:clamp(60px, 20vmin, 320px); line-height:.9; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.answer-big{display:grid; justify-items:center; gap:.5vmin}
.answer-big .unit{font-size:1.6em; font-weight:700; color:var(--ink-soft)}

.race{display:grid; gap:1.6vmin; width:min(100%, 140vmin)}
.lane{display:grid; grid-template-columns:auto 1fr 3.5em; align-items:center; gap:1em; font-weight:800; font-size:1.3em}
.lane .track{height:5vmin; border-radius:99px; background:var(--panel); overflow:hidden}
.lane .track i{display:block; height:100%; width:0; background:var(--pc,#888); border-radius:99px; transition:width .25s}
.lane .n{text-align:right; font-variant-numeric:tabular-nums}

.podium{display:flex; align-items:flex-end; gap:3vmin; justify-content:center}
.step{display:grid; justify-items:center; gap:1vmin; font-weight:800; text-align:center}
.step .disc{font-size:3.4em}
.step .block{width:22vmin; border-radius:2vmin 2vmin 0 0; display:grid; place-items:start center; padding-top:1.5vmin; font-size:2.4em; color:var(--ink)}
.step.p1 .block{height:30vmin; background:var(--c3); color:var(--on3)}
.step.p2 .block{height:21vmin; background:var(--panel)}
.step.p3 .block{height:15vmin; background:var(--panel-2)}
.step .pts{font-size:1.1em; color:var(--ink-soft)}
.winner{font-weight:800; font-size:clamp(30px, 8vmin, 130px); margin:0; letter-spacing:-.03em; animation:pop .6s cubic-bezier(.2,1.4,.4,1) both; text-align:center}

.notice{max-width:40ch; text-align:center; font-size:1.2em; line-height:1.4; display:grid; gap:1em; justify-items:center}
.warn{background:var(--buzz); color:#fff; padding:.4em 1em; border-radius:999px; font-weight:700; font-size:.85em}

/* ---------- phone ---------- */
.ph{min-height:100%; display:flex; flex-direction:column; padding:14px 16px 16px; gap:14px; max-width:560px; margin:0 auto}
.ph-head{display:flex; align-items:center; gap:10px; font-weight:700}
.ph-head .disc{font-size:1.2rem}
.ph-head .score{margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums}
.ph-body{flex:1; display:flex; flex-direction:column; gap:12px; justify-content:center}
.ph-title{font-weight:800; font-size:clamp(28px, 8vw, 44px); line-height:1; letter-spacing:-.02em; margin:0}
.ph-text{font-size:1.1rem; line-height:1.4; margin:0}
.center{text-align:center; align-items:center}
.answers{flex:1; display:grid; grid-template-rows:repeat(4, 1fr); gap:10px; min-height:62vh}
.ans{border:0; border-radius:20px; display:flex; align-items:center; gap:12px; padding:12px 18px; font-weight:800; font-size:clamp(17px, 5vw, 24px); text-align:left; line-height:1.15; box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)}
.ans:active{transform:scale(.98)}
.ans.faded{opacity:.25}
.ans.picked{box-shadow:inset 0 -6px 0 rgba(0,0,0,.22), 0 0 0 4px var(--ink)}
.ans[disabled]{cursor:default}
.mini-bar{height:8px; border-radius:99px; background:var(--panel); overflow:hidden}
.mini-bar i{display:block; height:100%; background:var(--ink); transform-origin:left}
.buzzer{
  border:0; width:min(78vw, 360px); aspect-ratio:1; border-radius:50%; margin:0 auto; background:var(--buzz); color:#fff;
  font-weight:800; font-size:clamp(36px, 12vw, 64px); letter-spacing:-.02em;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.25), 0 10px 0 var(--shade);
}
.buzzer:active{transform:translateY(8px); box-shadow:inset 0 -14px 0 rgba(0,0,0,.25), 0 2px 0 var(--shade)}
.full{border:0; flex:1; border-radius:28px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:clamp(40px, 14vw, 80px); min-height:60vh; user-select:none; -webkit-user-select:none}
.full.wait{background:var(--buzz)} .full.go{background:var(--go)} .full.tapper{background:var(--c0)}
.full small{display:block; font-size:.35em; font-weight:700; opacity:.9}
.result{border-radius:24px; padding:26px 20px; text-align:center; display:grid; gap:6px}
.result.ok{background:var(--ok); color:#fff} .result.bad{background:var(--bad); color:#fff} .result.none{background:var(--panel)}
.result b{font-size:clamp(34px, 11vw, 56px); line-height:1}
.result span{font-size:1.15rem; font-weight:700}
.field{display:grid; gap:6px; font-weight:700}
.field input{
  font:inherit; font-size:1.4rem; font-weight:700; padding:14px 16px; border-radius:16px; border:2px solid var(--line);
  background:var(--panel); color:var(--ink); width:100%;
}
.emojis{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.emojis button[disabled]{opacity:.2; filter:grayscale(1); cursor:default}
.emojis button{border:0; aspect-ratio:1; border-radius:14px; background:var(--panel); font-size:1.5rem}
.emojis button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.colors{display:flex; gap:10px; flex-wrap:wrap}
.colors button{border:0; width:40px; height:40px; border-radius:50%; background:var(--pc)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--stage), 0 0 0 6px var(--ink)}
.avatar-big{font-size:3.4rem; margin:0 auto}
.host{display:flex; gap:8px; align-items:center; justify-content:center; padding:10px; border-radius:18px; background:var(--panel-2)}
.host span{font-size:.85rem; color:var(--ink-soft); font-weight:700; margin-right:auto}
.host .btn{font-size:.9rem; padding:.55em 1.1em}
.banner{background:var(--buzz); color:#fff; border-radius:12px; padding:8px 12px; font-weight:700; font-size:.95rem; text-align:center}
.link{background:none; border:0; color:var(--ink-soft); text-decoration:underline; font-weight:700; padding:6px}
.estin{display:flex; gap:8px}
.estin input{flex:1}
/* ---------- anslutning ---------- */
.joinbox{display:flex; gap:3vmin; align-items:center; justify-content:center; text-align:left}
.qr{background:#fff; padding:1vmin; border-radius:2vmin; width:24vmin; height:24vmin; flex:none}
.qr svg{display:block; width:100%; height:100%}
.joinbox .lead{font-size:1.2em}
.url{font-weight:800; font-size:1.1em; margin:.3em 0 .6em; word-break:break-all}
.code{font-weight:800; font-size:clamp(36px, 10vmin, 160px); letter-spacing:.12em; line-height:1}
.hostqr{display:grid; justify-items:center; gap:1vmin; font-size:.8em}
.hostqr .qr{width:16vmin; height:16vmin}
.codein{text-transform:uppercase; letter-spacing:.2em}
/* ---------- karta ---------- */
.map{display:block; width:100%; height:auto; aspect-ratio:1000/991.3; background:var(--sea); touch-action:none; user-select:none; -webkit-user-select:none}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land); stroke:var(--border); stroke-width:1px; stroke-linejoin:round}
.map text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.lineto{stroke:var(--ink); opacity:.6; animation:fade .4s both; animation-delay:1.6s}
.pin-in{animation:pinIn .45s cubic-bezier(.2,1.4,.4,1) both; transform-box:fill-box; transform-origin:50% 100%}
.nopop .pin-in{animation:none}
@keyframes pinIn{from{opacity:0; transform:translateY(-40%) scale(.5)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0}}
.tvmap{border-radius:2.4vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.tvmap .map{height:56vmin; width:auto}
.georow{display:flex; gap:3vmin; align-items:center; justify-content:center; width:100%}
.georow .tvmap .map{height:70vmin}
.georow .rows{flex:1; max-width:72vmin; width:auto}
.georow .row{font-size:1.05em}
.phmap{position:relative; border-radius:18px; overflow:hidden; box-shadow:0 0 0 2px var(--line)}
.zoom{position:absolute; right:8px; top:8px; display:grid; gap:6px}
.zoom button{width:42px; height:42px; border-radius:12px; border:0; background:var(--panel); color:var(--ink); font-size:1.5rem; font-weight:800; box-shadow:0 2px 0 var(--line)}
.slingwrap{width:min(100%, calc((100vh - 24vmin) * 1600 / 650)); aspect-ratio:1600/650; border-radius:2vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.slingwrap canvas{display:block; width:100%; height:100%}
.sgame{position:fixed; left:0; top:0; z-index:60; box-sizing:border-box; background:var(--stage); display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 8px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.sgame.rot{transform-origin:0 0; transform:rotate(90deg) translateY(-100%)}
.sgstage{flex:1; min-height:0; width:100%; display:grid; place-items:center}
.sgbox{position:relative}
.sgcv{display:block; width:100%; height:100%; border-radius:12px; box-shadow:0 0 0 3px var(--panel)}
.sgpick{position:absolute; left:8px; top:8px; display:flex; gap:6px}
.sgpick button{border:0; border-radius:12px; background:rgba(255,255,255,.92); color:#22123F; padding:3px 6px; display:grid; justify-items:center; gap:1px; font-weight:800; font-size:.62rem; box-shadow:0 3px 0 rgba(34,18,63,.25)}
.sgpick button.on{outline:3px solid #E8213B; outline-offset:-3px}
.sgpick button:disabled{opacity:.35}
.sgscore{position:absolute; right:8px; top:8px; background:rgba(255,255,255,.92); color:#22123F; border-radius:12px; padding:5px 12px; font-weight:800; font-size:.95rem; display:flex; gap:12px; pointer-events:none}
.sgline{height:22px; line-height:22px; max-width:100%; font-weight:700; font-size:.85rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.slpad{border-radius:24px; background:var(--panel); overflow:hidden; touch-action:none}
.slpad canvas{display:block; width:100%; height:auto; aspect-ratio:600/560; touch-action:none; user-select:none; -webkit-user-select:none}
.picker{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pick{border:0; border-radius:16px; background:var(--panel); padding:6px 4px 8px; display:grid; justify-items:center; gap:2px; font-weight:800; font-size:1.05rem; box-shadow:0 3px 0 var(--line)}
.pick canvas{width:56px; height:56px}
.pick small{font-weight:700; font-size:.8rem; color:var(--ink-soft)}
.pick[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pick[disabled]{opacity:.35; cursor:default}
.slhead{display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; font-size:1.2rem}
.slhead .btn{font-size:.9rem; padding:.5em 1em}
.bigpick{display:grid; gap:10px}
.bp{border:0; border-radius:20px; background:var(--panel); display:flex; align-items:center; gap:14px; padding:10px 16px 10px 10px; text-align:left; box-shadow:0 4px 0 var(--line)}
.bp:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.bp canvas{width:76px; height:76px; flex:none}
.bp span{display:grid; gap:2px}
.bp b{font-size:1.5rem; font-weight:800}
.bp small{font-size:.95rem; color:var(--ink-soft); line-height:1.3}
.bp[disabled]{opacity:.35; cursor:default}
.ver{font-size:.75rem; color:var(--ink-soft); text-align:center; opacity:.8}
.towerwrap{width:min(100%, calc((100vh - 24vmin) * 16 / 9)); aspect-ratio:16/9; border-radius:2vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.towerwrap canvas{display:block; width:100%; height:100%}
.twhead{display:flex; align-items:center; gap:14px; background:var(--panel); border-radius:20px; padding:10px 14px; box-shadow:inset 0 0 0 4px var(--tc)}
.twhead canvas{width:72px; height:72px; flex:none}
.twhead div{display:grid; gap:2px}
.twhead small{font-weight:700; color:var(--ink-soft)}
.twhead b{font-size:1.9rem; line-height:1; color:var(--tc); text-shadow:0 0 1px var(--ink)}
.twhead span{font-size:.95rem}
.twinfo{display:flex; justify-content:space-between; font-weight:800; font-size:1.05rem}
.twpad{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px}
.twb{border:0; border-radius:18px; background:var(--panel); font-size:2rem; font-weight:800; aspect-ratio:1.3; box-shadow:0 5px 0 var(--line); user-select:none; -webkit-user-select:none; touch-action:none}
.twb:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.runpad{flex:1; border:0; border-radius:28px; background:var(--panel); display:grid; place-items:center; min-height:66vh; position:relative; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; cursor:pointer; box-shadow:0 6px 0 var(--line)}
.feet{display:flex; gap:26px; align-items:center}
.foot{width:92px; height:184px; transition:transform .04s ease-out; pointer-events:none}
.foot svg{width:100%; height:100%; display:block}
.runpad .foot.r{transform:translateY(-38px) rotate(5deg) scale(1.06)}
.runpad.alt .foot.r{transform:none}
.runpad.alt .foot.l{transform:translateY(-38px) rotate(-5deg) scale(1.06)}
.runhint{position:absolute; bottom:18px; left:0; right:0; text-align:center; font-weight:800; color:var(--ink-soft)}
.trickwrap{position:relative; height:66vmin; width:min(100%, 130vmin); display:flex; justify-content:center; border-radius:4vmin; overflow:hidden; background:#22123F}
.trickwrap .trickimg{height:100%; width:auto; max-width:100%; object-fit:contain; display:block}
.trickwrap .trickph{width:110vmin}
.trickph{display:grid; place-items:center; width:100%; height:100%; background:#FFD21F; font-size:min(30vmin, 40vw)}
.gotyou{position:absolute; left:0; right:0; bottom:5%; white-space:nowrap; text-align:center; font-weight:800; font-size:clamp(40px, 11vmin, 170px); color:#FFD21F; -webkit-text-stroke:.03em #22123F; text-shadow:0 .06em 0 #22123F; transform:rotate(-4deg); animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.gotyou.late{animation-delay:1s}
.full.trickbtn{background:#22123F; padding:0; overflow:hidden; position:relative}
.full.trickbtn > *{position:absolute; inset:0; width:100%; height:100%}
.full.trickbtn .trickimg{object-fit:cover; display:block}
.twinfo .lives{color:var(--bad); letter-spacing:.1em}
.kpad{flex:1; display:flex; flex-direction:column; gap:14px}
.joy{flex:1.4; position:relative; border-radius:22px; background:var(--panel); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; box-shadow:0 6px 0 var(--line); overflow:hidden}
.joyring{position:absolute; left:50%; top:50%; width:140px; height:140px; margin:-70px 0 0 -70px; border-radius:50%; border:3px dashed var(--line); display:grid; place-items:center; pointer-events:none}
.joyring.h{width:150px; height:66px; margin:-33px 0 0 -75px; border-radius:33px}
.joyring.on{border-style:solid; border-color:var(--ink-soft)}
.joyknob{width:56px; height:56px; border-radius:50%; background:var(--ink); opacity:.85; pointer-events:none}
.joyhint{position:absolute; bottom:12px; left:8px; right:8px; text-align:center; font-weight:700; color:var(--ink-soft); font-size:.85rem; pointer-events:none}
.pkpad{flex:1; display:flex; flex-direction:column; gap:8px}
.pkinfo{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:800; font-size:1.05rem}
.pknextw{display:flex; align-items:center; gap:4px; font-size:.8rem; color:var(--ink-soft)}
.pknext{width:60px; height:40px}
.pkcv{display:block; margin:0 auto; height:54vh; width:auto; max-width:100%; touch-action:none; user-select:none; -webkit-user-select:none}
.pkctrl{display:grid; grid-template-columns:1fr 1fr 1fr 1.3fr; gap:8px}
.pkbtn{min-height:68px; border:0; border-radius:18px; background:var(--panel); color:var(--ink); font-weight:800; font-size:1.8rem; box-shadow:0 5px 0 var(--line); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.pkbtn.on{transform:translateY(3px); box-shadow:0 2px 0 var(--line)}
.pkbtn.rot{background:var(--panel-2)}
.pkbtn.drop{background:var(--ok); color:#fff; font-size:1.1rem}
.fillpad{flex:1; display:flex; flex-direction:column; gap:10px}
.fillinfo{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:800; font-size:1.15rem}
.fillcv{width:100%; max-height:50vh; object-fit:contain; touch-action:none}
.fillbtn{min-height:20vh; border:0; border-radius:22px; font-weight:800; font-size:1.5rem; background:var(--ok); color:#fff; box-shadow:0 6px 0 var(--line); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.fillbtn.on{transform:translateY(4px); box-shadow:0 2px 0 var(--line); filter:brightness(1.12)}
.fillbtn:disabled{opacity:.5}
.kinfo{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:800; font-size:1.15rem}
.kinfo .muted{font-size:.8rem; font-weight:700}
.kctrl{flex:1; display:flex; gap:14px; min-height:56vh}
.kleft{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kright{flex:1; display:grid; grid-template-rows:2fr 1fr; gap:10px}
.kbtn{border:0; border-radius:22px; font-weight:800; font-size:1.5rem; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; background:var(--panel); color:var(--ink); box-shadow:0 6px 0 var(--line)}
.kbtn.steer{font-size:2.6rem}
.kbtn.gas{background:var(--ok); color:#fff}
.kbtn.brake{background:var(--bad); color:#fff}
.kbot{display:grid; grid-template-columns:1fr; gap:10px}
.kctrl > *{min-width:0}
.kbot .kbtn{font-size:1.2rem; padding:0 6px}
.kright.solo{grid-template-rows:1fr; flex:.8}
.kright.solo .kbtn.fire{font-size:1.45rem}
.kbtn.fire{color:#22123F; font-size:1rem; line-height:1.1; text-shadow:0 1px 0 rgba(255,255,255,.5)}
.kbtn[disabled]{opacity:.35}
.kbtn.on{transform:translateY(4px); box-shadow:0 2px 0 var(--line); filter:brightness(.88)}
</style>

function pinPath(r){ return `M0 0C${-r*.55} ${-r*1.1} ${-r} ${-r*1.5} ${-r} ${-r*2.05}A${r} ${r} 0 1 1 ${r} ${-r*2.05}C${r} ${-r*1.5} ${r*.55} ${-r*1.1} 0 0Z`; }

function targetEl(x, y, r, delay){

function fitBox(pts){
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let w = Math.max(170, (x1 - x0) * 1.5), h = Math.max(170 * MH / MW, (y1 - y0) * 1.5 + 60);
  if (w / h > MW / MH) h = w * MH / MW; else w = h * MW / MH;

  const tp = projXY(T.lat, T.lon);

  entries.forEach(e => svg.append(S("line", { class: "lineto", x1: e.p.x, y1: e.p.y, x2: tp.x, y2: tp.y, "stroke-width": (vb.w * .003).toFixed(2), "stroke-dasharray": `${(vb.w * .012).toFixed(2)} ${(vb.w * .008).toFixed(2)}` })));
  entries.forEach((e, i) => { const m = look(e.pid); svg.append(pinEl(e.p.x, e.p.y, rr, m.color, m.emoji, "pin", .15 * i)); });
  svg.append(targetEl(tp.x, tp.y, rr, .25 + .15 * entries.length));

}

let GAME_SEEN = new Set();
function draw(name, src, n){
  const key = e => String(e.k || e[0]);
  const used = lsGet(USED_KEY) || {};
  used[name] = used[name] || [];
  const out = []; let guard = 0;
  while (out.length < n && guard++ < 2000){
    if (!DECK[name] || !DECK[name].length){
      const u = new Set(used[name]);
      let fresh = src.filter(e => !u.has(key(e)) && !GAME_SEEN.has(key(e)));
      if (fresh.length < n - out.length){ used[name] = []; fresh = src.filter(e => !GAME_SEEN.has(key(e))); }
      if (!fresh.length) fresh = src.slice();
      DECK[name] = shuffle(fresh);
    }
    const e = DECK[name].pop();
    if (GAME_SEEN.has(key(e)) && src.length > n + GAME_SEEN.size) continue;
    GAME_SEEN.add(key(e)); out.push(e); used[name].push(key(e));
  }
  if (used[name].length > src.length - 1) used[name] = used[name].slice(-(src.length - 1));
  lsSet(USED_KEY, used);
  return out;
}

const meta = pid => H.players[pid] || (PL.me && PL.me.pid === pid ? PL.me : { name: "Spelare", emoji: "🙂", color: "#888888", online: false });

function pidOf(peer){

/* --- schemaläggning med paus --- */
function sched(fn, ms){ clearTimeout(H.t); H.pending = fn; H.waiting = false; H.t = setTimeout(fire, ms); }
function fire(){
  clearTimeout(H.t);
  if (!H.pending) return;
  if (H.pz){ H.waiting = true; changed(); return; }
  const f = H.pending; H.pending = null; f();
}
function skipNow(){ H.pz = false; fire(); changed(); }
function togglePause(){ H.pz = !H.pz; if (!H.pz && H.waiting){ H.waiting = false; fire(); } changed(); }

/* --- flödet --- */
function startGame(){
  if (!onlinePids().length) return;
  audioOn();
  H.scores = {}; onlinePids().forEach(p => H.scores[p] = 0);
  H.steps = buildSteps(H.len); H.si = -1; H.pz = false; H.endArm = false;
  next();
}
function toLobby(){ clearTimeout(H.t); H.pending = null; H.pz = false; H.waiting = false; H.ph = "lobby"; H.step = null; H.endArm = false; changed(); }
function next(){
  H.si++;
  const s = H.steps[H.si];
  if (!s){ toLobby(); return; }
  H.step = s; H.answers = {}; H.res = {}; H.out = []; H.lock = null; H.taps = {};
  RUN[s.t](s);
}
const RUN = {
  intro(s){ H.roundStart = { ...H.scores }; H.ph = "intro"; changed(); sched(next, 7000); },
  mc(s){
    H.qid = ++QID; H.q = s.q; H.o = s.o; H.c = s.c; H.dur = s.tf ? 10000 : 15000; H.qStart = Date.now(); H.deadline = H.qStart + H.dur;
    H.ph = "q"; changed(); sched(revealMc, H.dur);
  },
  buzz(s){
    H.qid = ++QID; H.q = s.q; H.o = s.o; H.c = s.c; H.dur = 20000; H.deadline = Date.now() + H.dur;
    H.ph = "buzz"; changed(); sched(revealBuzz, H.dur);
  },
  react(s){ H.qid = ++QID; H.ph = "rwait"; H.dur = 0; H.deadline = 0; changed(); sched(reactGo, 2500 + Math.random() * 4000); },
  est(s){
    H.qid = ++QID; H.q = s.q; H.ans = s.a; H.unit = s.u; H.dur = 25000; H.deadline = Date.now() + H.dur;
    H.ph = "est"; changed(); sched(revealEst, H.dur);
  },
  geo(s){
    H.qid = ++QID; H.q = s.q; H.glat = s.lat; H.glon = s.lon; H.dur = 30000; H.deadline = Date.now() + H.dur;
    H.ph = "geo"; changed(); sched(revealGeo, H.dur);
  },
  tap(s){ H.qid = ++QID; H.ph = "tapready"; H.dur = 3500; H.deadline = Date.now() + 3500; changed(); sched(tapGo, 3500); },
  sling(s){ slStart(s); },
  tower(s){ twStart(); },
  race(s){ raceStart(); },
  fill(s){ fillStart(); },
  pack(s){ packStart(); },
  kart(s){ kartStart(); },
  scores(s){ H.ph = "scores"; changed(); sched(next, 9000); },
  end(s){ H.ph = "end"; SFX.fanfare(); changed(); }
};
function revealMc(){
  const mult = H.step.mult || 1; let anyOk = false;
  for (const pid in H.answers){
    const a = H.answers[pid], ok = !!H.step.all || a.c === H.c;
    const p = ok ? Math.round((500 + 500 * Math.max(0, 1 - a.t / H.dur)) / 10) * 10 * mult : 0;
    if (ok) anyOk = true;
    H.res[pid] = { ok, p, c: a.c }; addScore(pid, p);
  }
  H.ph = "reveal"; anyOk ? SFX.ok() : SFX.bad(); changed(); sched(next, 6000);
}
function lockBuzz(pid){
  H.lock = pid; H.savedRem = Math.max(2000, H.deadline - Date.now()); H.lockDeadline = Date.now() + 7000;
  SFX.buzz(); changed(); sched(() => buzzWrong(pid, -1), 7000);
}
function buzzWrong(pid, c){
  H.res[pid] = { ok: false, p: -400, c }; addScore(pid, -400); H.out.push(pid); H.lock = null; SFX.bad();
  if (!onlinePids().some(p => !H.out.includes(p))){ revealBuzz(); return; }
  H.deadline = Date.now() + H.savedRem; changed(); sched(revealBuzz, H.savedRem);
}
function revealBuzz(){ H.lock = null; H.ph = "reveal"; changed(); sched(next, 6000); }
function trickArt(cls){
  if (TRICK_IMG) return h("img", { class: cls, src: TRICK_IMG, alt: "" });
  return h("div", { class: cls + " trickph" }, "🤡");
}
function trickReveal(){
  for (const pid in H.answers) if (H.answers[pid].trick){ H.res[pid] = { trick: true, p: -300 }; addScore(pid, -300); }
  H.ph = "rtrickr"; changed(); sched(next, 6000);
}
function reactGo(){
  if (H.step && H.step.trick){ H.ph = "rtrick"; H.dur = 3000; H.deadline = Date.now() + 3000; SFX.buzz(); changed(); sched(trickReveal, 3000); return; } H.ph = "rgo"; H.dur = 4000; H.deadline = Date.now() + 4000; SFX.go(); changed(); sched(reactReveal, 4000); }
function reactReveal(){
  const good = Object.entries(H.answers).filter(([, a]) => !a.early).sort((a, b) => a[1].ms - b[1].ms);
  const pts = [500, 300, 150];
  good.forEach(([pid, a], i) => { const p = pts[i] || 50; H.res[pid] = { ms: a.ms, p }; addScore(pid, p); });
  Object.entries(H.answers).filter(([, a]) => a.early).forEach(([pid]) => H.res[pid] = { early: true, p: 0 });
  H.ph = "rres"; SFX.ok(); changed(); sched(next, 6000);
}
function revealEst(){
  const list = Object.entries(H.answers).map(([pid, a]) => [pid, a.v, Math.abs(a.v - H.ans)]).sort((a, b) => a[2] - b[2]);
  const pts = [1000, 600, 300]; let rank = 0;
  list.forEach((x, i) => {
    if (i > 0 && x[2] > list[i - 1][2]) rank = i;
    let p = pts[rank] || 100; if (x[2] === 0) p += 500;
    H.res[x[0]] = { v: x[1], d: x[2], p }; addScore(x[0], p);
  });
  H.ph = "estr"; SFX.ok(); changed(); sched(next, 8000);
}
function revealGeo(){
  const T = { lat: H.glat, lon: H.glon };
  const list = Object.entries(H.answers).map(([pid, a]) => [pid, a, kmBetween(a, T)]).sort((a, b) => a[2] - b[2]);
  const pts = [1000, 600, 300]; let rank = 0;
  list.forEach((x, i) => {
    if (i > 0 && Math.round(x[2]) > Math.round(list[i - 1][2])) rank = i;
    let p = pts[rank] || 100; if (x[2] <= 25) p += 300;
    H.res[x[0]] = { lat: x[1].lat, lon: x[1].lon, km: Math.round(x[2] * 10) / 10, p }; addScore(x[0], p);
  });
  H.ph = "geor"; SFX.ok(); changed(); sched(next, 12000);
}
function tapGo(){ H.ph = "tap"; H.dur = 8000; H.deadline = Date.now() + 8000; SFX.go(); changed(); sched(tapEnd, 9300); }
function tapEnd(){
  const list = Object.entries(H.taps).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  const pts = [600, 350, 150]; let rank = 0;
  list.forEach(([pid, n], i) => {
    if (i > 0 && n < list[i - 1][1]) rank = i;
    const p = pts[rank] || 50; H.res[pid] = { n, p }; addScore(pid, p);
  });
  H.ph = "tapr"; SFX.ok(); changed(); sched(next, 6500);
}

/* --- inkommande från telefoner --- */
function onAnswer(msg){
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid) return;
  if (H.ph === "q"){
    const c = d.c | 0; if (H.answers[pid] || c < 0 || c > 3) return;
    H.answers[pid] = { c, t: Date.now() - H.qStart }; changed();
    if (allAnswered()) fire();
  } else if (H.ph === "buzz" && H.lock === pid){
    const c = d.c | 0; if (c < 0 || c > 3) return;
    if (c === H.c){ H.res[pid] = { ok: true, p: 800, c }; addScore(pid, 800); H.lock = null; H.ph = "reveal"; SFX.ok(); changed(); sched(next, 6000); }
    else buzzWrong(pid, c);
  } else if (H.ph === "geo"){
    const lat = Number(d.lat), lon = Number(d.lon);
    if (H.answers[pid] || !isFinite(lat) || !isFinite(lon) || lat < 30 || lat > 75 || lon < -30 || lon > 50) return;
    H.answers[pid] = { lat: Math.round(lat * 1000) / 1000, lon: Math.round(lon * 1000) / 1000 }; changed();
    if (allAnswered()) fire();
  } else if (H.ph === "est"){
    const v = Number(d.v); if (H.answers[pid] || !isFinite(v)) return;
    H.answers[pid] = { v: Math.round(v * 100) / 100 }; changed();
    if (allAnswered()) fire();
  }
}
function onBuzz(msg){
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid || H.ph !== "buzz" || H.lock || H.out.includes(pid)) return;
  lockBuzz(pid);
}
function onReact(msg){
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid || H.answers[pid]) return;
  if (H.ph === "rwait"){ H.answers[pid] = { early: true }; SFX.bad(); changed(); }
  else if (H.ph === "rtrick"){ H.answers[pid] = { trick: true }; SFX.bad(); changed(); }
  else if (H.ph === "rgo"){
    if (d.early) H.answers[pid] = { early: true };
    else { const ms = Number(d.ms); if (!isFinite(ms)) return; H.answers[pid] = { ms: Math.round(Math.min(9999, Math.max(90, ms))) }; }
    changed(); if (allAnswered()) fire();
  }
}
function onTap(msg){
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid || H.ph !== "tap") return;
  const n = Math.min(160, Math.max(0, d.n | 0));
  if (n > (H.taps[pid] || 0)){ H.taps[pid] = n; updateRace(); }
}
function restartRound(){
  if (!H.step || H.ph === "lobby" || H.ph === "end") return;
  const introIdx = H.steps.findIndex(s => s.t === "intro" && s.rn === H.step.rn);
  if (introIdx < 0) return;
  const back = {};
  for (const pid in H.scores) back[pid] = H.roundStart[pid] != null ? H.roundStart[pid] : 0;
  H.scores = back;
  clearTimeout(H.t); H.pending = null; H.pz = false; H.waiting = false; H.lock = null; H.restartArm = false;
  H.si = introIdx - 1;
  next();
}
function onCtl(msg){
  const a = (msg.data || {}).a;
  if (a === "start" && H.ph === "lobby") startGame();
  else if (a === "skip" && H.ph !== "lobby" && H.ph !== "end") skipNow();
  else if (a === "pause" && H.ph !== "lobby" && H.ph !== "end") togglePause();
  else if (a === "again" && H.ph === "end") toLobby();
  else if (a === "restart") restartRound();
}
function onPeersTV(ch){
  const seen = {}; let tvs = 0;
  for (const p of ch.peers){
    if (p.presence && p.presence.role === "tv" && !p.sameTab) tvs++;
    const m = cleanMeta(p.presence); if (!m) continue;
    const isNew = !H.players[m.pid];
    H.players[m.pid] = { ...m, online: true };
    seen[m.pid] = true;
    if (isNew){ SFX.join(); if (H.ph !== "lobby" && H.scores[m.pid] == null) H.scores[m.pid] = 0; }
  }
  for (const pid in H.players) if (!seen[pid]) H.players[pid].online = false;
  otherTV = tvs > 0;
  const firstBy = {}; H.dup = [];
  for (const pid in H.players){ const pl = H.players[pid]; if (!pl.online) continue; if (firstBy[pl.emoji]) H.dup.push(pid); else firstBy[pl.emoji] = pid; }
  if (ch.joined && ch.joined.length) pub();
  tvRender();
}

/* --- fysik --- */
function slBuild(){
  const M = Matter;
  if (SL.engine){ try { M.Events.off(SL.engine); M.Composite.clear(SL.engine.world, false); M.Engine.clear(SL.engine); } catch(e){} }
  const E = SL.engine = M.Engine.create({ enableSleeping: true });
  E.gravity.y = 1;
  M.Composite.add(E.world, M.Bodies.rectangle(SLW / 2, GY + 60, SLW * 3, 120, { isStatic: true, label: "ground", friction: .9 }));
  SL.bodies = []; SL.rm = []; SL.parts = []; SL.texts = []; SL.projs = [];
  const box = (kind, cx, bottom, w, h) => {
    const K = KINDS[kind];
    const b = M.Bodies.rectangle(cx, bottom - h / 2, w, h, { density: K.density, friction: .7, restitution: .08, label: kind });
    b.plugin = { kind, hp: K.hp, max: K.hp, pts: K.pts, w, h, by: null };
    M.Composite.add(E.world, b); SL.bodies.push(b);
  };
  bigWall = () => { for (let k = 0; k < 4; k++) box("wall", 760, GY - k * 78, 64, 78); };
  LEVELS[SL.level % LEVELS.length](box, (x, bottom) => box("bottle", x, bottom, 48, 30));
  SL.armed = false;
  for (let i = 0; i < 90; i++) M.Engine.update(E, 1000 / 60);
  M.Events.on(E, "collisionStart", slCollide);
  M.Events.on(E, "beforeUpdate", slBefore);
}
const isProj = b => !!(b && b.plugin && b.plugin.proj);
function slCollide(ev){
  if (!SL.armed) return;
  for (const pr of ev.pairs){
    const a = pr.bodyA.parent, b = pr.bodyB.parent;
    if (isProj(a) && a.plugin.who === "josef" && !a.plugin.ex){ slExplode(a); continue; }
    if (isProj(b) && b.plugin.who === "josef" && !b.plugin.ex){ slExplode(b); continue; }
    const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    slHit(a, b, rv); slHit(b, a, rv);
  }
}
function slHit(t, other, rv){
  const P = t.plugin; if (!P || !P.kind || P.dead) return;
  const op = other.plugin || {}, fromProj = !!op.proj;
  const owner = fromProj ? op.owner : op.by;
  if (owner && rv > .4) P.by = owner;
  let dmg = rv * (fromProj ? 1.8 : 1);
  if (P.kind === "wall") dmg *= fromProj ? .25 : .5;
  if (P.kind === "bottle" && fromProj && rv > .6) dmg = 99;

}
function slBreak(b){
  const P = b.plugin; if (P.dead) return; P.dead = true;
  SL.rm.push(b);
  const owner = P.by, m = owner ? meta(owner) : null;
  if (owner) SL.rs[owner] = (SL.rs[owner] || 0) + P.pts;
  const { x, y } = b.position;
  const col = P.kind === "wood" ? "#C98B4B" : P.kind === "glass" ? "#BFE3FF" : P.kind === "stone" ? "#9097A3" : "#F2DFAE";
  const n = P.kind === "bottle" ? 18 : 8;
  for (let i = 0; i < n; i++) SL.parts.push({ x, y, vx: (Math.random() - .5) * 10, vy: -Math.random() * 9, life: 50 + Math.random() * 30, col, s: P.kind === "bottle" ? 7 : 9, round: P.kind === "bottle" });
  if (P.kind === "bottle"){ SL.texts.push({ x, y: y - 40, t: `${m ? m.emoji + " " : ""}Cash! +1500`, life: 90, col: m ? m.color : "#E8213B", size: 40 }); SFX.pop(); }
  else if (m) SL.texts.push({ x, y: y - 20, t: `${m.emoji} +${P.pts}`, life: 50, col: "#22123F", size: 24 });
}
function slExplode(p){
  if (!p || p.plugin.ex) return;
  p.plugin.ex = true; SFX.boom();
  const owner = p.plugin.owner, pos = { x: p.position.x, y: p.position.y }, R = 200;
  for (const b of SL.bodies){
    if (b.plugin.dead) continue;
    const dx = b.position.x - pos.x, dy = b.position.y - pos.y, d = Math.hypot(dx, dy);
    if (d > R) continue;
    const f = 1 - d / R, k = 15 * f / Math.max(1, Math.sqrt(b.mass / 1.5));
    Matter.Sleeping.set(b, false);
    Matter.Body.setVelocity(b, { x: b.velocity.x + dx / (d || 1) * k, y: b.velocity.y + dy / (d || 1) * k - 3 * f });

  for (let i = 0; i < 40; i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 12; SL.parts.push({ x: pos.x, y: pos.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: 60 + Math.random() * 40, col: cols[i % cols.length], s: 8, confetti: true }); }
  const m = meta(owner);
  SL.texts.push({ x: pos.x, y: pos.y - 30, t: `${m.emoji} BOOM!`, life: 70, col: "#FF8A1F", size: 64 });
}
function slBefore(){
  const E = SL.engine;

    Matter.Body.setAngle(p, Math.atan2(p.velocity.y, p.velocity.x)); Matter.Body.setAngularVelocity(p, 0);
    if (Math.random() < .5) SL.parts.push({ x: p.position.x - Math.cos(p.angle) * 40, y: p.position.y - Math.sin(p.angle) * 40, vx: -p.velocity.x * .2 + (Math.random() - .5) * 2, vy: -p.velocity.y * .2 + (Math.random() - .5) * 2, life: 18, col: Math.random() < .5 ? "#FFB020" : "#FF6B4A", s: 10, round: true, nograv: true });
  }
}
function slLaunch(pid, who, a, pw){
  const M = Matter, nf = { group: -7 }; let body, speed;

  else if (who === "aston"){ body = M.Bodies.rectangle(SX, SY, 30, 66, { chamfer: { radius: 7 }, density: .005, restitution: .35, friction: .6, frictionAir: .006, label: "proj", collisionFilter: nf }); speed = 5 + 15 * pw; }

const SLDT = 1000 / 60;
function slStep(){

/* --- ritning av banan (delas av telefon och TV-repris) --- */
function slWorld(c, W, Hh, sc, ox, oy){
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, "#8ECFFF"); g.addColorStop(1, "#E6F6FF");
  c.fillStyle = g; c.fillRect(0, 0, W, Hh);
  if (sc === 1){
    const flag = ["#2F6BFF", "#FF8A1F", "#15A85C", "#FFD21F"];
    c.strokeStyle = "#ffffff"; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 14); c.quadraticCurveTo(W / 2, 42, W, 14); c.stroke();
    for (let i = 0; i < W / 80; i++){
      const x0 = i * 80 + 4, t = (x0 + 36) / W, yy = 14 + 4 * 14 * t * (1 - t);
      c.fillStyle = flag[i % 4]; c.beginPath(); c.moveTo(x0, yy); c.lineTo(x0 + 72, yy); c.lineTo(x0 + 36, yy + 40); c.closePath(); c.fill();
    }
  }
  c.setTransform(sc, 0, 0, sc, -ox * sc, -oy * sc);
  c.fillStyle = "#FFE27A"; c.beginPath(); c.arc(1150, VY + 150, 50, 0, 7); c.fill();
  c.fillStyle = "#A8DB86"; c.beginPath(); c.moveTo(0, GY);
  for (let x = 0; x <= SLW; x += 40) c.lineTo(x, GY - 70 - 40 * Math.sin(x / 260) - 25 * Math.sin(x / 97));
  c.lineTo(SLW, GY); c.closePath(); c.fill();
  c.fillStyle = "#6DBB4E"; c.fillRect(0, GY, SLW, 16); c.fillStyle = "#8B5A2B"; c.fillRect(0, GY + 16, SLW, SLH - GY - 16);
  c.lineCap = "round"; c.strokeStyle = "#7A4E22"; c.lineWidth = 16;
  c.beginPath(); c.moveTo(SX, GY); c.lineTo(SX, SY + 60); c.lineTo(SX + 22, SY - 14); c.stroke();
  for (const b of SL.bodies) if (!b.plugin.dead) (b.plugin.kind === "bottle" ? drawBottle : drawBlock)(c, b);
  // sikte
  if (SL.sub === "aim" && SL.who){
    const a = SL.aim ? SL.aim.a : .5, p = SL.aim ? SL.aim.p : 0;
    const pos = { x: SX - Math.cos(a) * p * 90, y: SY + Math.sin(a) * p * 90 };
    if (SL.aim && p > .05){
      const josef = SL.who === "josef", sp = josef ? 10 + 12 * p : 5 + 15 * p;
      let vx = Math.cos(a) * sp, vy = -Math.sin(a) * sp, x = SX, y = SY;
      const gr = josef ? .2778 * .12 : .2778, fa = josef ? .998 : .994;
      c.fillStyle = "rgba(255,255,255,.9)";
      for (let i = 1; i <= 48; i++){
        vy += gr; vx *= fa; vy *= fa; x += vx; y += vy;
        if (i % 4 === 0){ c.beginPath(); c.arc(x, y, 7 - i / 12, 0, 7); c.fill(); }
      }
    }
    c.strokeStyle = "#3A2410"; c.lineWidth = 7;
    c.beginPath(); c.moveTo(SX + 22, SY - 14); c.lineTo(pos.x, pos.y); c.stroke();
    if (SL.who === "josef") drawJosef(c, pos.x, pos.y, -a, 1); else drawBaby(c, pos.x, pos.y, 26, 0, SL.who);
    c.beginPath(); c.moveTo(SX - 22, SY - 14); c.lineTo(pos.x, pos.y); c.stroke();
  } else {
    c.strokeStyle = "#3A2410"; c.lineWidth = 7;
    c.beginPath(); c.moveTo(SX + 22, SY - 14); c.lineTo(SX, SY + 6); c.lineTo(SX - 22, SY - 14); c.stroke();
  }
  for (const p of SL.projs){
    const P = p.plugin, x = p.position.x, y = p.position.y;
    if (P.who === "josef") drawJosef(c, x, y, p.angle, 1); else drawBaby(c, x, y, 26, p.angle, P.who);
  }
  c.strokeStyle = "#7A4E22"; c.lineWidth = 16;
  c.beginPath(); c.moveTo(SX, SY + 60); c.lineTo(SX - 22, SY - 14); c.stroke();
  SL.parts = SL.parts.filter(q => q.life > 0);
  if (SL.parts.length > 600) SL.parts.splice(0, SL.parts.length - 600);
  for (const q of SL.parts){
    q.x += q.vx; q.y += q.vy; if (!q.nograv) q.vy += .35; q.vx *= .99; q.life--;
    c.globalAlpha = Math.min(1, q.life / 20); c.fillStyle = q.col;
    if (q.round){ c.beginPath(); c.arc(q.x, q.y, q.s / 2, 0, 7); c.fill(); }
    else { c.save(); c.translate(q.x, q.y); c.rotate(q.life * .2); c.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / (q.confetti ? 2 : 1)); c.restore(); }
  }
  c.globalAlpha = 1;
  SL.texts = SL.texts.filter(t => t.life > 0);
  for (const t of SL.texts){
    t.y -= .8; t.life--; c.globalAlpha = Math.min(1, t.life / 25);
    c.font = `800 ${t.size}px 'Bricolage Grotesque', system-ui, sans-serif`; c.textAlign = "center"; c.textBaseline = "middle";
    c.lineWidth = 6; c.strokeStyle = "#ffffff"; c.strokeText(t.t, t.x, t.y); c.fillStyle = t.col; c.fillText(t.t, t.x, t.y);
  }
  c.globalAlpha = 1;
  c.setTransform(1, 0, 0, 1, 0, 0);
}

/* --- TV: ställning medan alla spelar, sedan repris av vinnaren --- */
const CH_LETTER = { josef: "j", aston: "a", leah: "l" }, LETTER_CH = { j: "josef", a: "aston", l: "leah" };
function slStart(s){
  if (!SL.canvas){ SL.canvas = h("canvas", { width: SLW, height: VH, "aria-label": "Dollarjakten" }); SL.ctx = SL.canvas.getContext("2d"); SL.wrap = h("div", { class: "slingwrap" }, SL.canvas); }
  SL.pl = {}; SL.lv = Math.floor(Math.random() * LEVELS.length); SL.rep = null; SL.ending = false;
  H.qid = ++QID; H.ph = "sling"; H.dur = 100000; H.deadline = Date.now() + H.dur;
  changed(); sched(slTimeUp, H.dur + 4000);
  if (!SL.raf) SL.raf = requestAnimationFrame(slLoop);
}
function slRanking(){ return Object.keys(SL.pl).filter(p => H.players[p]).sort((a, b) => (SL.pl[b].sc - SL.pl[a].sc) || (SL.pl[a].n - SL.pl[b].n)); }
function onFire(msg){
  if (H.ph !== "sling") return;
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid || !Array.isArray(d.sh)) return;
  const sh = [];
  for (const r of d.sh.slice(0, 3)){
    if (!Array.isArray(r)) return;
    const w = LETTER_CH[r[0]], a = Number(r[1]), p = Number(r[2]), b = r[3] | 0, s = r[4] | 0;
    if (!w || !isFinite(a) || !isFinite(p) || s < 1 || s > 700 || sh.some(x => x.w === w)) return;
    sh.push({ w, a: clampA(a), p: Math.min(1, Math.max(.05, p)), b: Math.max(-1, Math.min(s, b)), s });
  }
  const sc = Math.max(0, Math.min(40000, d.sc | 0)), cur = SL.pl[pid];
  if (cur && sh.length < cur.sh.length) return;
  SL.pl[pid] = { n: sh.length, sc, sh };
  const on = onlinePids();
  if (!SL.ending && on.length && on.every(p => SL.pl[p] && SL.pl[p].n >= 3)){ SL.ending = true; sched(slTimeUp, 1800); }
}
function slTimeUp(){
  if (H.ph !== "sling") return;
  const win = slRanking()[0], W = win && SL.pl[win];
  if (!W || W.sc <= 0 || !W.sh.length){ slEnd(); return; }
  SL.level = SL.lv; slBuild(); SL.rs = {};
  SL.rep = { pid: win, shots: W.sh, sc: W.sc, i: 0, k: 0, acc: 0, last: 0, phase: "title", t0: performance.now() };
  H.ph = "slingrep"; H.deadline = 0; H.dur = 0; SFX.ok(); changed();
}
function slReplayTick(){
  const R = SL.rep, now = performance.now();
  if (R.phase === "title"){
    const sh = R.shots[R.i]; SL.who = sh.w; SL.sub = "aim";
    const f = Math.min(1, (now - R.t0) / 1200); SL.aim = { a: sh.a, p: sh.p * f };
    if (now - R.t0 > 1700){ SL.sub = "fly"; SL.aim = null; slLaunch(R.pid, sh.w, sh.a, sh.p); R.k = 0; R.acc = 0; R.last = now; R.phase = "fly"; }
  } else if (R.phase === "fly"){
    const sh = R.shots[R.i];
    R.acc += Math.min(100, now - R.last); R.last = now;
    while (R.acc >= SLDT && R.phase === "fly"){
      R.acc -= SLDT;
      if (R.k === sh.b){ const p = SL.projs.find(q => q.plugin.who === "josef" && !q.plugin.ex); if (p) slExplode(p); }
      slStep(); R.k++;
      if (R.k >= sh.s){ slClearProjs(); R.phase = "pause"; R.t0 = now; }
    }
  } else if (R.phase === "pause"){
    SL.sub = "wait";
    if (now - R.t0 > 900){
      R.i++;
      if (R.i >= R.shots.length){ R.phase = "done"; R.t0 = now; sched(slEnd, 3500); }
      else { R.phase = "title"; R.t0 = now; }
    }
  }
}
function slRepHud(){

  c.fillStyle = "#22123F"; c.textAlign = "left"; c.font = font(800, 28); c.fillText(`${m.emoji} ${m.name}`, 166, 86);

/* --- telefonen: håll inne och släpp vid linjen --- */

/* ================= Packa lastbilen (lagerövning, alla samtidigt) ================= */
const PK_W = 8, PK_H = 14, PK_DUR = 75000, PK_CELL = 40;
const PK_SHAPES = { I: [[0,0],[1,0],[2,0],[3,0]], O: [[0,0],[1,0],[0,1],[1,1]], T: [[0,0],[1,0],[2,0],[1,1]], L: [[0,0],[0,1],[0,2],[1,2]], J: [[1,0],[1,1],[1,2],[0,2]], S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]] };
const PK_COL = { I: "#7FB1DD", O: "#E9A27C", T: "#9C7FD9", L: "#E2B65A", J: "#86BF78", S: "#E07D96", Z: "#6FC7C2" };
const PACK = { canvas: null, ctx: null, wrap: null, p: {}, start: 0, raf: 0, pops: [] };
function packStart(){
  if (!PACK.canvas){ PACK.canvas = h("canvas", { width: FW, height: FH, "aria-label": "Packa lastbilen" }); PACK.ctx = PACK.canvas.getContext("2d"); PACK.wrap = h("div", { class: "towerwrap" }, PACK.canvas); }
  PACK.p = {}; PACK.pops = [];
  H.qid = ++QID; H.ph = "packready"; H.dur = 3500; H.deadline = Date.now() + 3500;
  changed(); sched(packGo, 3500);
  if (!PACK.raf) PACK.raf = requestAnimationFrame(packLoop);
}
function packGo(){ H.ph = "pack"; PACK.start = Date.now(); H.dur = PK_DUR; H.deadline = PACK.start + PK_DUR; SFX.go(); changed(); sched(packEnd, PK_DUR + 1500); }
function onPack(msg){
  if (H.ph !== "pack") return;
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid) return;
  const el = Date.now() - PACK.start, pts = Math.max(0, d.p | 0), c = Math.max(0, d.c | 0), t = Math.max(0, d.t | 0), f = Math.max(0, Math.min(100, d.f | 0));
  if (c > el / 1000 * 20 + 40 || pts > c * 30 + t * 1000 + 100) return;
  const cur = PACK.p[pid];
  if (cur && c < cur.c) return;
  if (cur && t > cur.t) PACK.pops.push({ pid, t: performance.now(), txt: "🚚 IVÄG!" });
  PACK.p[pid] = { p: pts, c, t, f };
}
function packRanking(){ return Object.keys(PACK.p).filter(p => PACK.p[p].c > 0).sort((a, b) => (PACK.p[b].p - PACK.p[a].p) || (PACK.p[b].c - PACK.p[a].c)); }
function packEnd(){
  if (H.ph !== "pack") return;
  let rank = 0; const order = packRanking();
  order.forEach((pid, i) => {
    const P = PACK.p[pid];
    if (i > 0 && P.p < PACK.p[order[i - 1]].p) rank = i;
    const p = P.p > 0 ? (RACE_PTS[rank] || 40) : 0;
    H.res[pid] = { place: rank + 1, p, pts: P.p, c: P.c, t: P.t }; if (p) addScore(pid, p);
  });
  H.ph = "packr"; SFX.fanfare(); changed(); sched(next, 9000);
}
function packLoop(){
  if (!["packready", "pack", "packr"].includes(H.ph)){ PACK.raf = 0; return; }
  packDraw();
  PACK.raf = requestAnimationFrame(packLoop);
}

function pkRot(cells){ const r = cells.map(([x, y]) => [y, -x]); const mx = Math.min(...r.map(p => p[0])), my = Math.min(...r.map(p => p[1])); return r.map(([x, y]) => [x - mx, y - my]); }

function packPad(st){
  const qid = st.qid;

  const nextKind = () => { if (!bag.length) bag.push(...shuffle(Object.keys(PK_SHAPES))); return bag.pop(); };
  const G = PL.pk = { qid, grid: [], cur: null, next: nextKind(), pts: 0, c: 0, tc: 0, t: 0, last: performance.now(), fallAt: 0, pause: 0, msg: null, running: false, sent: "" };
  const empty = () => { G.grid = Array.from({ length: PK_H }, () => Array(PK_W).fill(null)); G.tc = 0; G.rows = 0; };
  empty();
  const W = PK_W * PK_CELL, Hh = PK_H * PK_CELL;
  const cv = h("canvas", { class: "pkcv", width: W + 24, height: Hh + 24, "aria-label": "Lastbilens lastutrymme" }), c = cv.getContext("2d");
  const nx = h("canvas", { class: "pknext", width: 120, height: 80, "aria-hidden": "true" }), nc = nx.getContext("2d");
  const infoL = h("span"), infoR = h("span");
  const over = () => Date.now() > PL.deadline;
  const fits = (cells, x, y) => cells.every(([cx, cy]) => { const gx = x + cx, gy = y + cy; return gx >= 0 && gx < PK_W && gy < PK_H && (gy < 0 || !G.grid[gy][gx]); });
  const send = () => emitP("tw", { qid, p: G.pts, c: G.c, t: G.t, f: Math.round(G.tc / (PK_W * PK_H) * 100) });
  const say = (t, col) => { G.msg = { t, col, at: performance.now() }; };
  const spawn = () => {
    const k = G.next; G.next = nextKind();
    const cells = PK_SHAPES[k].map(p => p.slice()), w = Math.max(...cells.map(p => p[0])) + 1;
    const cur = { k, cells, x: Math.floor((PK_W - w) / 2), y: 0 };
    if (!fits(cur.cells, cur.x, cur.y)){ depart(); return; }
    G.cur = cur; G.fallAt = performance.now() + fallMs();
  };
  const depart = () => {
    const f = G.tc / (PK_W * PK_H), bonus = Math.round(f * f * 1000 / 10) * 10;
    G.pts += bonus; G.t++; G.cur = null; G.pause = performance.now() + 2400;
    say(`${f >= .8 ? "Snyggt packat! " : "Lastbilen åker! "}${Math.round(f * 100)} %  +${bonus}`, f >= .8 ? "#15A85C" : f >= .5 ? "#C99700" : "#E8213B");
    vibrate([60, 40, 60]); send();
    setTimeout(() => { if (PL.pk === G){ empty(); say("Ny lastbil backar in…", "#6B5E86"); } }, 1300);
  };
  const fallMs = () => { const el = Math.max(0, PK_DUR - Math.max(0, PL.deadline - Date.now())); return Math.max(170, 650 - el / 1000 * 6.5); };
  const lock = () => {
    for (const [cx, cy] of G.cur.cells){ const gy = G.cur.y + cy; if (gy >= 0) G.grid[gy][G.cur.x + cx] = PK_COL[G.cur.k]; }
    G.c += 4; G.tc += 4; G.pts += 10;
    const full = G.grid.filter(r => r.every(Boolean)).length;
    const nf = full - (G.rows || 0);
    if (nf > 0){ G.pts += 80 * nf; say(nf > 1 ? `${nf} hela rader! +${80 * nf}` : "Hel rad! +80", "#C99700"); }
    G.rows = full;
    G.cur = null; vibrate(20); send();
    if (!over()) spawn();
  };
  const move = dx => { if (!G.cur || G.pause) return; if (fits(G.cur.cells, G.cur.x + dx, G.cur.y)) G.cur.x += dx; };
  const rotate = () => {
    if (!G.cur || G.pause) return;
    const r = pkRot(G.cur.cells);
    for (const k of [0, -1, 1, -2, 2]) if (fits(r, G.cur.x + k, G.cur.y)){ G.cur.cells = r; G.cur.x += k; vibrate(10); return; }
  };
  const drop = () => { if (!G.cur || G.pause) return; while (fits(G.cur.cells, G.cur.x, G.cur.y + 1)) G.cur.y++; lock(); };
  const down = () => { if (!G.cur || G.pause) return; if (fits(G.cur.cells, G.cur.x, G.cur.y + 1)){ G.cur.y++; G.fallAt = performance.now() + fallMs(); } else lock(); };
  G.ctl = { move, rotate, drop, down };
  const hold = (label, fn, cls, aria) => {
    const b = h("button", { class: "pkbtn " + cls, "aria-label": aria }, label); let iv = null, to = null;
    const stop = () => { clearTimeout(to); clearInterval(iv); to = iv = null; b.classList.remove("on"); };
    b.addEventListener("pointerdown", e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} b.classList.add("on"); fn(); to = setTimeout(() => { iv = setInterval(fn, 70); }, 200); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => b.addEventListener(ev, stop));

  };
  const tap = (label, fn, cls, aria) => { const b = h("button", { class: "pkbtn " + cls, "aria-label": aria }, label); b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("on"); fn(); setTimeout(() => b.classList.remove("on"), 120); }); return b; };
  // tryck på lastutrymmet för att vrida
  cv.addEventListener("pointerdown", e => { e.preventDefault(); rotate(); });
  if (!PL.pkKeys){
    PL.pkKeys = true;
    window.addEventListener("keydown", e => {
      const g = PL.pk; if (!g || !g.ctl || !document.querySelector(".pkpad")) return;
      const k = e.key;
      if (k === "ArrowLeft") g.ctl.move(-1); else if (k === "ArrowRight") g.ctl.move(1); else if (k === "ArrowUp") g.ctl.rotate(); else if (k === "ArrowDown") g.ctl.down(); else if (k === " ") g.ctl.drop(); else return;
      e.preventDefault();
    });
  }
  G.tick = () => {
    if (!cv.isConnected){ G.running = false; return; }
    const now = performance.now();
    if (G.pause && now > G.pause){ G.pause = 0; if (!over()) spawn(); }
    if (!G.cur && !G.pause && !over() && G.tc === 0 && !G.started){ G.started = true; spawn(); }
    if (G.cur && !G.pause && !over() && now >= G.fallAt){
      if (fits(G.cur.cells, G.cur.x, G.cur.y + 1)){ G.cur.y++; G.fallAt = now + fallMs(); } else lock();
    }
    if (over() && G.cur){ G.cur = null; send(); }
    // rita lastutrymmet
    c.clearRect(0, 0, W + 24, Hh + 24);
    c.fillStyle = "#4A4656"; c.beginPath(); rrect(c, 0, 0, W + 24, Hh + 24, 14); c.fill();
    c.fillStyle = "#F3F1F7"; c.fillRect(12, 12, W, Hh);
    c.strokeStyle = "rgba(34,18,63,.07)"; c.lineWidth = 1;
    for (let x = 1; x < PK_W; x++){ c.beginPath(); c.moveTo(12 + x * PK_CELL, 12); c.lineTo(12 + x * PK_CELL, 12 + Hh); c.stroke(); }
    for (let y = 1; y < PK_H; y++){ c.beginPath(); c.moveTo(12, 12 + y * PK_CELL); c.lineTo(12 + W, 12 + y * PK_CELL); c.stroke(); }
    c.fillStyle = "rgba(34,18,63,.12)"; c.font = "800 34px 'Bricolage Grotesque', system-ui, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("MARIA NILA", 12 + W / 2, 12 + Hh * .45);
    for (let y = 0; y < PK_H; y++) for (let x = 0; x < PK_W; x++) if (G.grid[y][x]) pkBox(c, 12 + x * PK_CELL, 12 + y * PK_CELL, PK_CELL, G.grid[y][x]);
    if (G.cur){
      let gy = G.cur.y; while (fits(G.cur.cells, G.cur.x, gy + 1)) gy++;
      c.strokeStyle = "rgba(34,18,63,.35)"; c.lineWidth = 2; c.setLineDash([5, 4]);
      for (const [cx, cy] of G.cur.cells) c.strokeRect(12 + (G.cur.x + cx) * PK_CELL + 3, 12 + (gy + cy) * PK_CELL + 3, PK_CELL - 6, PK_CELL - 6);
      c.setLineDash([]);
      for (const [cx, cy] of G.cur.cells) pkBox(c, 12 + (G.cur.x + cx) * PK_CELL, 12 + (G.cur.y + cy) * PK_CELL, PK_CELL, PK_COL[G.cur.k]);
    }
    if (G.msg && now - G.msg.at < 1600){
      const a = Math.min(1, (1600 - (now - G.msg.at)) / 300);
      c.globalAlpha = a; c.font = "800 26px 'Bricolage Grotesque', system-ui, sans-serif"; c.lineWidth = 7; c.strokeStyle = "#fff";
      c.strokeText(G.msg.t, 12 + W / 2, 12 + Hh * .3); c.fillStyle = G.msg.col; c.fillText(G.msg.t, 12 + W / 2, 12 + Hh * .3); c.globalAlpha = 1;
    }
    if (over()){ c.fillStyle = "rgba(34,18,63,.55)"; c.fillRect(12, 12, W, Hh); c.fillStyle = "#fff"; c.font = "800 34px 'Bricolage Grotesque', system-ui, sans-serif"; c.fillText("Tiden är slut!", 12 + W / 2, 12 + Hh / 2); }
    // nästa bit
    nc.clearRect(0, 0, 120, 80);
    const ns = PK_SHAPES[G.next], nw = Math.max(...ns.map(p => p[0])) + 1, nh = Math.max(...ns.map(p => p[1])) + 1, s = 18;
    for (const [x, y] of ns) pkBox(nc, 60 - nw * s / 2 + x * s, 40 - nh * s / 2 + y * s, s, PK_COL[G.next]);
    const fill = Math.round(G.tc / (PK_W * PK_H) * 100);
    infoL.textContent = `Lastbil ${G.t + 1} · ${fill} % full`; infoR.textContent = `${fmt(G.pts)} p`;
    requestAnimationFrame(G.tick);
  };
  G.run = () => { if (!G.running){ G.running = true; requestAnimationFrame(G.tick); } };
  clearInterval(PL.pkIv); PL.pkIv = setInterval(() => { if (!cv.isConnected){ clearInterval(PL.pkIv); return; } send(); }, 2500);
  G.el = h("div", { class: "pkpad" },
    h("div", { class: "pkinfo" }, infoL, h("span", { class: "pknextw" }, "Nästa", nx), infoR),
    miniBar(PL.deadline, st.dur),
    cv,
    h("div", { class: "pkctrl" }, hold("◀", () => move(-1), "", "Flytta vänster"), tap("⟳", rotate, "rot", "Vrid"), hold("▶", () => move(1), "", "Flytta höger"), tap("SLÄPP", drop, "drop", "Släpp ner")),
    h("p", { class: "ph-text muted", style: "text-align:center; font-size:.8rem; margin:0" }, "Tryck på lastbilen eller ⟳ för att vrida. När bilen är full åker den och en ny backar in."));
  G.run();
  return G.el;
}

/* ================= Maria Nila 100 meter (löpning) ================= */
const RW = 1600, RH = 900, RCX = 800, RCY = 450, RSL = 700, R0 = 178, LW = 30, NL = 8;
const RXL = RCX - RSL / 2, RXR = RCX + RSL / 2, RXLINE = RXL + RSL * .7;
const RACE_RECORD = 9500;
const RACE_PTS = [1000, 750, 600, 450, 350, 270, 200, 150, 100, 80, 60, 50];
const RACE = { canvas: null, ctx: null, wrap: null, lanes: {}, taps: {}, disp: {}, fin: {}, goal: 140, raw: {}, start: 0, raf: 0, crowd: null, ending: false };
function trackPoint(k, f){
  const R = R0 + k * LW, P = 2 * RSL + 2 * Math.PI * R;
  let s = Math.max(0, Math.min(1, f)) * P;
  const a = RXR - RXLINE;
  if (s <= a) return { x: RXLINE + s, y: RCY + R }; s -= a;
  if (s <= Math.PI * R){ const t = Math.PI / 2 - s / R; return { x: RXR + R * Math.cos(t), y: RCY + R * Math.sin(t) }; } s -= Math.PI * R;
  if (s <= RSL) return { x: RXR - s, y: RCY - R }; s -= RSL;
  if (s <= Math.PI * R){ const t = -Math.PI / 2 - s / R; return { x: RXL + R * Math.cos(t), y: RCY + R * Math.sin(t) }; } s -= Math.PI * R;
  return { x: RXL + s, y: RCY + R };
}
function runPoint(slot, f){
  const K = 3.5, b = trackPoint(K, f), f2 = f < .999 ? f + .001 : f - .001, b2 = trackPoint(K, f2);
  let tx = b2.x - b.x, ty = b2.y - b.y; if (f2 < f){ tx = -tx; ty = -ty; }
  const l = Math.hypot(tx, ty) || 1, off = ((slot % 5) - 2) * 11;
  return { x: b.x - ty / l * off, y: b.y + tx / l * off };
}
function stadiumPath(c, r){
  c.beginPath(); c.moveTo(RXL, RCY - r); c.lineTo(RXR, RCY - r);
  c.arc(RXR, RCY, r, -Math.PI / 2, Math.PI / 2); c.lineTo(RXL, RCY + r);
  c.arc(RXL, RCY, r, Math.PI / 2, Math.PI * 1.5); c.closePath();
}
function raceStart(){
  if (!RACE.canvas){ RACE.canvas = h("canvas", { width: RW, height: RH, "aria-label": "Maria Nila Arena" }); RACE.ctx = RACE.canvas.getContext("2d"); RACE.wrap = h("div", { class: "towerwrap" }, RACE.canvas); }
  if (!RACE.crowd){ RACE.crowd = []; let sd = 7; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280; const cols = ["#FF5DA2", "#45C8FF", "#FFD21F", "#FF8A1F", "#9BE23B", "#FFFFFF", "#A78BFA"]; for (let i = 0; i < 900; i++) RACE.crowd.push([rnd() * RW, rnd() * RH, cols[i % cols.length]]); }
  RACE.lanes = {}; shuffle(onlinePids()).forEach((p, i) => RACE.lanes[p] = i);
  RACE.taps = {}; RACE.disp = {}; RACE.fin = {}; RACE.raw = {}; RACE.ending = false;
  H.qid = ++QID; H.ph = "raceready"; H.dur = 3500; H.deadline = Date.now() + 3500;
  changed(); sched(raceGo, 3500);
  if (!RACE.raf) RACE.raf = requestAnimationFrame(raceLoop);
}
function raceGo(){ H.ph = "race"; RACE.start = Date.now(); H.dur = 50000; H.deadline = RACE.start + 50000; SFX.go(); changed(); sched(raceEnd, 50000); }
function onRaceTap(msg){
  if (H.ph !== "race") return;
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid) return;
  if (!(pid in RACE.lanes)) RACE.lanes[pid] = Object.keys(RACE.lanes).length;
  if (RACE.fin[pid]) return;
  const el = Date.now() - RACE.start, cap = Math.floor(6 + el / 1000 * 30);
  const n = Math.min(cap, RACE.goal, Math.max(0, d.n | 0));
  if (n > (RACE.taps[pid] || 0)) RACE.taps[pid] = n;
  if (RACE.taps[pid] >= RACE.goal){
    const f = Number(d.f), raw = isFinite(f) && f > 0 ? Math.min(f, el + 500) : el;
    RACE.raw[pid] = raw; RACE.fin[pid] = Math.max(RACE_RECORD, raw);
    tone(660, .1, "triangle", 0, .2); tone(990, .2, "triangle", .1, .2);
    changed();
    if (!RACE.ending && onlinePids().every(p => RACE.fin[p])){ RACE.ending = true; sched(raceEnd, 1800); }
  }
}
function raceRanking(){
  const fins = Object.keys(RACE.fin).sort((a, b) => (RACE.fin[a] - RACE.fin[b]) || ((RACE.raw[a] || 0) - (RACE.raw[b] || 0)));
  const rest = Object.keys(RACE.lanes).filter(p => !RACE.fin[p] && (RACE.taps[p] || 0) > 0).sort((a, b) => (RACE.taps[b] || 0) - (RACE.taps[a] || 0));

}
function raceEnd(){
  raceRanking().forEach((pid, i) => {
    const p = RACE_PTS[i] || 40;

}

function racePad(st){
  const goal = st.goal || 140, qid = st.qid;

    PL.raceQid = qid; PL.rtaps = 0; PL.rStart = performance.now(); PL.rDone = false; PL.rSent = 0;
    clearInterval(PL.rIv);

  }

    if (PL.rtaps >= goal){
      PL.rDone = true; clearInterval(PL.rIv);
      emitP("tap", { qid, n: PL.rtaps, f: performance.now() - PL.rStart });
      vibrate(250); phRender(true);
    }

  pad.addEventListener("touchstart", e => { e.preventDefault(); step(e.changedTouches.length); }, { passive: false });

}

function kartPhysics(dt){
