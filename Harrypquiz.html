<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harry Potter-quizet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#EEE7FF; --stage-2:#DCCFFF; --ink:#22123F; --ink-soft:#5E4D86; --panel:#FFFFFF; --panel-2:#F6F1FF; --line:#CDBEF5; --shade:#22123F;
  --c0:#2F6BFF; --c1:#FF8A1F; --c2:#15A85C; --c3:#FFD21F; --on0:#FFFFFF; --on1:#2A1400; --on2:#FFFFFF; --on3:#2A1A00;
  --buzz:#E8213B; --ok:#15A85C; --bad:#E8213B; --go:#13BF62;
  --sea:#BDD3FF; --land:#FFF8EA; --border:#B3A0E6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#1C0E3A; --stage-2:#2F1860; --ink:#FFF4E2; --ink-soft:#BCA9EA; --panel:#2B1857; --panel-2:#241349; --line:#4B3394; --shade:#07021A;
    --sea:#172A61; --land:#3D2D74; --border:#7863C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --stage:#1C0E3A; --stage-2:#2F1860; --ink:#FFF4E2; --ink-soft:#BCA9EA; --panel:#2B1857; --panel-2:#241349; --line:#4B3394; --shade:#07021A;
  --sea:#172A61; --land:#3D2D74; --border:#7863C8;
  color-scheme: dark;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; height:100%; color:var(--ink);
  background:var(--stage);
  background-image:radial-gradient(ellipse 70% 55% at 50% -8%, var(--stage-2), transparent 70%);
  font-family:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{height:100%}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button:focus-visible, input:focus-visible{outline:3px solid var(--c3); outline-offset:3px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

/* ---------- shared bits ---------- */
.disc{
  --pc:#888; display:inline-grid; place-items:center; width:1.9em; height:1.9em; border-radius:50%;
  background:var(--pc); font-size:1em; line-height:1; box-shadow:inset 0 -.14em 0 rgba(0,0,0,.25);
}
.btn{
  border:0; border-radius:999px; padding:.7em 1.5em; font-weight:800; font-size:1.05rem;
  background:var(--ink); color:var(--stage); box-shadow:0 .22em 0 var(--shade);
}
.btn:active{transform:translateY(.15em); box-shadow:0 .07em 0 var(--shade)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--line)}
.shape{display:inline-grid; place-items:center; width:1.5em; height:1.5em; border-radius:.35em; background:rgba(255,255,255,.22); font-size:.8em; flex:none}
.c0{background:var(--c0); color:var(--on0)} .c1{background:var(--c1); color:var(--on1)}
.c2{background:var(--c2); color:var(--on2)} .c3{background:var(--c3); color:var(--on3)}
.c1 .shape,.c3 .shape{background:rgba(0,0,0,.12)}
.muted{color:var(--ink-soft)}

/* ---------- home ---------- */
.home{min-height:100%; display:grid; place-items:center; padding:24px}
.home-in{max-width:520px; width:100%; display:grid; gap:18px; text-align:center}
.logo{font-weight:800; font-size:clamp(40px, 9vw, 100px); line-height:.95; letter-spacing:-.03em; margin:0; text-wrap:balance}
.dots{display:flex; gap:.5em; justify-content:center}
.dots span{width:1.1em; height:1.1em; border-radius:50%; box-shadow:inset 0 -.18em 0 rgba(0,0,0,.25)}
.choice{display:grid; gap:12px; margin-top:8px}
.choice button{
  border:0; border-radius:22px; padding:20px 22px; text-align:left; background:var(--panel);
  box-shadow:0 5px 0 var(--line); display:grid; gap:4px;
}
.choice button b{font-size:1.35rem}
.choice button span{color:var(--ink-soft); font-size:.98rem; line-height:1.35}

/* ---------- TV ---------- */
.tv{height:100%; display:grid; grid-template-rows:auto 1fr auto; padding:2.6vmin 4vmin 2.2vmin; gap:2vmin; font-size:clamp(14px, 2.2vmin, 34px); overflow:hidden}
.tv-top{display:flex; justify-content:space-between; align-items:baseline; gap:2em; min-height:1.4em; color:var(--ink-soft); font-weight:700; font-size:1.15em}
.tv-main{display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3vmin; min-height:0}
.tv-bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:2em}
.strip{display:flex; flex-wrap:wrap; gap:1.2em; align-items:flex-end}
.chip{display:grid; justify-items:center; gap:.25em; font-weight:700; position:relative; transition:transform .25s, opacity .25s}
.chip .disc{font-size:1.5em}
.chip small{font-size:.8em; color:var(--ink-soft); font-weight:700}
.chip.done{transform:translateY(-.5em)}
.chip.done::after{content:"✓"; position:absolute; top:-.3em; right:-.3em; width:1.3em; height:1.3em; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:.8em}
.chip.off{opacity:.35}
.chip.out{opacity:.35; filter:grayscale(1)}
.chip .gain{position:absolute; top:-1.6em; font-weight:800; color:var(--ok); white-space:nowrap; animation:rise .6s ease-out both}
.chip .gain.neg{color:var(--bad)}
@keyframes rise{from{opacity:0; transform:translateY(.6em)} to{opacity:1; transform:none}}
.ctrls{display:flex; gap:.5em; flex-wrap:wrap; justify-content:flex-end}
.ctrls .btn{font-size:.75em; padding:.55em 1.1em}

.question{font-weight:800; font-size:clamp(26px, 5.6vmin, 92px); line-height:1.08; letter-spacing:-.02em; text-align:center; max-width:22ch; margin:0; text-wrap:balance}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:2vmin; width:min(100%, 150vmin)}
.tile{
  border-radius:2.4vmin; padding:2.2vmin 2.6vmin; display:flex; align-items:center; gap:.7em;
  font-weight:800; font-size:clamp(18px, 3.7vmin, 60px); line-height:1.1; min-height:13vmin;
  box-shadow:inset 0 -.6vmin 0 rgba(0,0,0,.22); transition:opacity .35s, transform .35s; position:relative;
}
.tile.dim{opacity:.22}
.tile.right{transform:scale(1.04); box-shadow:inset 0 -.6vmin 0 rgba(0,0,0,.22), 0 0 0 .7vmin var(--ink)}
.tile .pickers{margin-left:auto; font-size:.75em; letter-spacing:.1em}
.status{font-weight:700; font-size:1.3em; text-align:center; min-height:1.3em}
.status.big{font-size:2em; font-weight:800}
.bar{width:min(100%, 150vmin); height:1.6vmin; border-radius:99px; background:var(--panel); overflow:hidden}
.bar i{display:block; height:100%; background:var(--ink); transform-origin:left; border-radius:99px}

.intro{text-align:center; display:grid; gap:2vmin; justify-items:center; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.intro-num{font-weight:700; font-size:1.4em; color:var(--ink-soft)}
.intro-title{font-weight:800; font-size:clamp(40px, 13vmin, 210px); line-height:.9; letter-spacing:-.04em; margin:0}
.intro-desc{font-size:1.5em; max-width:34ch; margin:0; line-height:1.3; text-wrap:balance}
@keyframes pop{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none}}

.lobby{display:grid; justify-items:center; gap:3vmin; text-align:center; width:100%}
.lobby .logo{font-size:clamp(36px, 8.5vmin, 150px); text-shadow:.05em .05em 0 var(--c1); max-width:18ch}
.lobby .dots{font-size:3vmin}
.lead{font-size:1.4em; margin:0; max-width:36ch; line-height:1.3}
.grid-players{display:flex; flex-wrap:wrap; gap:2.4vmin; justify-content:center; min-height:9vmin; align-items:center}
.grid-players .chip .disc{font-size:2.2em}
.seg{display:inline-flex; background:var(--panel); border-radius:999px; padding:.3em; gap:.2em}
.seg button{border:0; background:transparent; padding:.5em 1.2em; border-radius:999px; font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--stage)}
.lobby .start{font-size:1.5em}

.signal{width:min(100%,150vmin); flex:1; max-height:56vmin; border-radius:4vmin; display:grid; place-items:center; text-align:center; font-weight:800; color:#fff}
.signal.wait{background:var(--buzz)} .signal.go{background:var(--go)}
.signal b{font-size:clamp(40px,16vmin,260px); line-height:1; letter-spacing:-.04em}
.signal span{font-size:1.4em; font-weight:700; opacity:.9}

.rows{display:grid; gap:1.2vmin; width:min(100%, 120vmin)}
.row{display:grid; grid-template-columns:2.2em auto 1fr auto auto; align-items:center; gap:1em; background:var(--panel); border-radius:2vmin; padding:1vmin 2vmin; font-weight:700; font-size:1.25em}
.row .rank{font-weight:800; color:var(--ink-soft)}
.row .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .val{font-weight:800; font-variant-numeric:tabular-nums}
.row .delta{font-weight:800; color:var(--ok); min-width:4.5em; text-align:right; font-variant-numeric:tabular-nums}
.row .delta.neg{color:var(--bad)}
.row .track{height:1.2vmin; border-radius:99px; background:var(--panel-2); overflow:hidden}
.row .track i{display:block; height:100%; border-radius:99px; background:var(--pc,#888); transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row.first{box-shadow:0 0 0 .5vmin var(--c3)}

.bignum{font-weight:800; font-size:clamp(60px, 20vmin, 320px); line-height:.9; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.answer-big{display:grid; justify-items:center; gap:.5vmin}
.answer-big .unit{font-size:1.6em; font-weight:700; color:var(--ink-soft)}

.race{display:grid; gap:1.6vmin; width:min(100%, 140vmin)}
.lane{display:grid; grid-template-columns:auto 1fr 3.5em; align-items:center; gap:1em; font-weight:800; font-size:1.3em}
.lane .track{height:5vmin; border-radius:99px; background:var(--panel); overflow:hidden}
.lane .track i{display:block; height:100%; width:0; background:var(--pc,#888); border-radius:99px; transition:width .25s}
.lane .n{text-align:right; font-variant-numeric:tabular-nums}

.podium{display:flex; align-items:flex-end; gap:3vmin; justify-content:center}
.step{display:grid; justify-items:center; gap:1vmin; font-weight:800; text-align:center}
.step .disc{font-size:3.4em}
.step .block{width:22vmin; border-radius:2vmin 2vmin 0 0; display:grid; place-items:start center; padding-top:1.5vmin; font-size:2.4em; color:var(--ink)}
.step.p1 .block{height:30vmin; background:var(--c3); color:var(--on3)}
.step.p2 .block{height:21vmin; background:var(--panel)}
.step.p3 .block{height:15vmin; background:var(--panel-2)}
.step .pts{font-size:1.1em; color:var(--ink-soft)}
.winner{font-weight:800; font-size:clamp(30px, 8vmin, 130px); margin:0; letter-spacing:-.03em; animation:pop .6s cubic-bezier(.2,1.4,.4,1) both; text-align:center}

.notice{max-width:40ch; text-align:center; font-size:1.2em; line-height:1.4; display:grid; gap:1em; justify-items:center}
.warn{background:var(--buzz); color:#fff; padding:.4em 1em; border-radius:999px; font-weight:700; font-size:.85em}

/* ---------- phone ---------- */
.ph{min-height:100%; display:flex; flex-direction:column; padding:14px 16px 16px; gap:14px; max-width:560px; margin:0 auto}
.ph-head{display:flex; align-items:center; gap:10px; font-weight:700}
.ph-head .disc{font-size:1.2rem}
.ph-head .score{margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums}
.ph-body{flex:1; display:flex; flex-direction:column; gap:12px; justify-content:center}
.ph-title{font-weight:800; font-size:clamp(28px, 8vw, 44px); line-height:1; letter-spacing:-.02em; margin:0}
.ph-text{font-size:1.1rem; line-height:1.4; margin:0}
.center{text-align:center; align-items:center}
.answers{flex:1; display:grid; grid-template-rows:repeat(4, 1fr); gap:10px; min-height:62vh}
.ans{border:0; border-radius:20px; display:flex; align-items:center; gap:12px; padding:12px 18px; font-weight:800; font-size:clamp(17px, 5vw, 24px); text-align:left; line-height:1.15; box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)}
.ans:active{transform:scale(.98)}
.ans.faded{opacity:.25}
.ans.picked{box-shadow:inset 0 -6px 0 rgba(0,0,0,.22), 0 0 0 4px var(--ink)}
.ans[disabled]{cursor:default}
.mini-bar{height:8px; border-radius:99px; background:var(--panel); overflow:hidden}
.mini-bar i{display:block; height:100%; background:var(--ink); transform-origin:left}
.buzzer{
  border:0; width:min(78vw, 360px); aspect-ratio:1; border-radius:50%; margin:0 auto; background:var(--buzz); color:#fff;
  font-weight:800; font-size:clamp(36px, 12vw, 64px); letter-spacing:-.02em;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.25), 0 10px 0 var(--shade);
}
.buzzer:active{transform:translateY(8px); box-shadow:inset 0 -14px 0 rgba(0,0,0,.25), 0 2px 0 var(--shade)}
.full{border:0; flex:1; border-radius:28px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:clamp(40px, 14vw, 80px); min-height:60vh; user-select:none; -webkit-user-select:none}
.full.wait{background:var(--buzz)} .full.go{background:var(--go)} .full.tapper{background:var(--c0)}
.full small{display:block; font-size:.35em; font-weight:700; opacity:.9}
.result{border-radius:24px; padding:26px 20px; text-align:center; display:grid; gap:6px}
.result.ok{background:var(--ok); color:#fff} .result.bad{background:var(--bad); color:#fff} .result.none{background:var(--panel)}
.result b{font-size:clamp(34px, 11vw, 56px); line-height:1}
.result span{font-size:1.15rem; font-weight:700}
.field{display:grid; gap:6px; font-weight:700}
.field input{
  font:inherit; font-size:1.4rem; font-weight:700; padding:14px 16px; border-radius:16px; border:2px solid var(--line);
  background:var(--panel); color:var(--ink); width:100%;
}
.emojis{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.emojis button[disabled]{opacity:.2; filter:grayscale(1); cursor:default}
.emojis button{border:0; aspect-ratio:1; border-radius:14px; background:var(--panel); font-size:1.5rem}
.emojis button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.colors{display:flex; gap:10px; flex-wrap:wrap}
.colors button{border:0; width:40px; height:40px; border-radius:50%; background:var(--pc)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--stage), 0 0 0 6px var(--ink)}
.avatar-big{font-size:3.4rem; margin:0 auto}
.host{display:flex; gap:8px; align-items:center; justify-content:center; padding:10px; border-radius:18px; background:var(--panel-2)}
.host span{font-size:.85rem; color:var(--ink-soft); font-weight:700; margin-right:auto}
.host .btn{font-size:.9rem; padding:.55em 1.1em}
.banner{background:var(--buzz); color:#fff; border-radius:12px; padding:8px 12px; font-weight:700; font-size:.95rem; text-align:center}
.link{background:none; border:0; color:var(--ink-soft); text-decoration:underline; font-weight:700; padding:6px}
.estin{display:flex; gap:8px}
.estin input{flex:1}
/* ---------- anslutning ---------- */
.joinbox{display:flex; gap:3vmin; align-items:center; justify-content:center; text-align:left}
.qr{background:#fff; padding:1vmin; border-radius:2vmin; width:24vmin; height:24vmin; flex:none}
.qr svg{display:block; width:100%; height:100%}
.joinbox .lead{font-size:1.2em}
.url{font-weight:800; font-size:1.1em; margin:.3em 0 .6em; word-break:break-all}
.code{font-weight:800; font-size:clamp(36px, 10vmin, 160px); letter-spacing:.12em; line-height:1}
.hostqr{display:grid; justify-items:center; gap:1vmin; font-size:.8em}
.hostqr .qr{width:16vmin; height:16vmin}
.codein{text-transform:uppercase; letter-spacing:.2em}
/* ---------- karta ---------- */
.map{display:block; width:100%; height:auto; aspect-ratio:1000/1205.8; background:var(--sea); touch-action:none; user-select:none; -webkit-user-select:none}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land); stroke:var(--border); stroke-width:1px; stroke-linejoin:round}
.map text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.lineto{stroke:var(--ink); opacity:.6; animation:fade .4s both; animation-delay:1.6s}
.pin-in{animation:pinIn .45s cubic-bezier(.2,1.4,.4,1) both; transform-box:fill-box; transform-origin:50% 100%}
.nopop .pin-in{animation:none}
@keyframes pinIn{from{opacity:0; transform:translateY(-40%) scale(.5)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0}}
.tvmap{border-radius:2.4vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.tvmap .map{height:56vmin; width:auto}
.georow{display:flex; gap:3vmin; align-items:center; justify-content:center; width:100%}
.georow .tvmap .map{height:70vmin}
.georow .rows{flex:1; max-width:72vmin; width:auto}
.georow .row{font-size:1.05em}
.phmap{position:relative; border-radius:18px; overflow:hidden; box-shadow:0 0 0 2px var(--line)}
.zoom{position:absolute; right:8px; top:8px; display:grid; gap:6px}
.zoom button{width:42px; height:42px; border-radius:12px; border:0; background:var(--panel); color:var(--ink); font-size:1.5rem; font-weight:800; box-shadow:0 2px 0 var(--line)}
.slingwrap{width:min(100%, calc((100vh - 24vmin) * 1600 / 650)); aspect-ratio:1600/650; border-radius:2vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.slingwrap canvas{display:block; width:100%; height:100%}
.slpad{border-radius:24px; background:var(--panel); overflow:hidden; touch-action:none}
.slpad canvas{display:block; width:100%; height:auto; aspect-ratio:600/560; touch-action:none; user-select:none; -webkit-user-select:none}
.picker{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pick{border:0; border-radius:16px; background:var(--panel); padding:6px 4px 8px; display:grid; justify-items:center; gap:2px; font-weight:800; font-size:1.05rem; box-shadow:0 3px 0 var(--line)}
.pick canvas{width:56px; height:56px}
.pick small{font-weight:700; font-size:.8rem; color:var(--ink-soft)}
.pick[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pick[disabled]{opacity:.35; cursor:default}
.slhead{display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; font-size:1.2rem}
.slhead .btn{font-size:.9rem; padding:.5em 1em}
.bigpick{display:grid; gap:10px}
.bp{border:0; border-radius:20px; background:var(--panel); display:flex; align-items:center; gap:14px; padding:10px 16px 10px 10px; text-align:left; box-shadow:0 4px 0 var(--line)}
.bp:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.bp canvas{width:76px; height:76px; flex:none}
.bp span{display:grid; gap:2px}
.bp b{font-size:1.5rem; font-weight:800}
.bp small{font-size:.95rem; color:var(--ink-soft); line-height:1.3}
.bp[disabled]{opacity:.35; cursor:default}
.ver{font-size:.75rem; color:var(--ink-soft); text-align:center; opacity:.8}
.towerwrap{width:min(100%, calc((100vh - 24vmin) * 16 / 9)); aspect-ratio:16/9; border-radius:2vmin; overflow:hidden; box-shadow:0 0 0 .5vmin var(--panel)}
.towerwrap canvas{display:block; width:100%; height:100%}
.twhead{display:flex; align-items:center; gap:14px; background:var(--panel); border-radius:20px; padding:10px 14px; box-shadow:inset 0 0 0 4px var(--tc)}
.twhead canvas{width:72px; height:72px; flex:none}
.twhead div{display:grid; gap:2px}
.twhead small{font-weight:700; color:var(--ink-soft)}
.twhead b{font-size:1.9rem; line-height:1; color:var(--tc); text-shadow:0 0 1px var(--ink)}
.twhead span{font-size:.95rem}
.twinfo{display:flex; justify-content:space-between; font-weight:800; font-size:1.05rem}
.twpad{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px}
.twb{border:0; border-radius:18px; background:var(--panel); font-size:2rem; font-weight:800; aspect-ratio:1.3; box-shadow:0 5px 0 var(--line); user-select:none; -webkit-user-select:none; touch-action:none}
.twb:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.runpad{flex:1; border:0; border-radius:28px; background:var(--panel); display:grid; place-items:center; min-height:66vh; position:relative; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; cursor:pointer; box-shadow:0 6px 0 var(--line)}
.feet{display:flex; gap:26px; align-items:center}
.foot{width:92px; height:184px; transition:transform .04s ease-out; pointer-events:none}
.foot svg{width:100%; height:100%; display:block}
.runpad .foot.r{transform:translateY(-38px) rotate(5deg) scale(1.06)}
.runpad.alt .foot.r{transform:none}
.runpad.alt .foot.l{transform:translateY(-38px) rotate(-5deg) scale(1.06)}
.runhint{position:absolute; bottom:18px; left:0; right:0; text-align:center; font-weight:800; color:var(--ink-soft)}
.trickwrap{position:relative; height:66vmin; width:min(100%, 130vmin); display:flex; justify-content:center; border-radius:4vmin; overflow:hidden; background:#22123F}
.trickwrap .trickimg{height:100%; width:auto; max-width:100%; object-fit:contain; display:block}
.trickwrap .trickph{width:110vmin}
.trickph{display:grid; place-items:center; width:100%; height:100%; background:#FFD21F; font-size:min(30vmin, 40vw)}
.gotyou{position:absolute; left:0; right:0; bottom:5%; white-space:nowrap; text-align:center; font-weight:800; font-size:clamp(40px, 11vmin, 170px); color:#FFD21F; -webkit-text-stroke:.03em #22123F; text-shadow:0 .06em 0 #22123F; transform:rotate(-4deg); animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.gotyou.late{animation-delay:1s}
.full.trickbtn{background:#22123F; padding:0; overflow:hidden; position:relative}
.full.trickbtn > *{position:absolute; inset:0; width:100%; height:100%}
.full.trickbtn .trickimg{object-fit:cover; display:block}
.twinfo .lives{color:var(--bad); letter-spacing:.1em}
.flypad{flex:1; position:relative; border-radius:28px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; background:#141640; cursor:pointer}
.flypad{display:block; flex:none !important}
.flypad canvas{display:block; width:100%; height:auto; max-height:70vh; object-fit:contain}
.flypad .runhint{color:#fff}
</style>

function onAnswer(msg){

    const c = d.c | 0; if (H.answers[pid] || c < 0 || c > 3) return;
    H.answers[pid] = { c, t: Date.now() - H.qStart }; changed();
    if (allAnswered()) fire();
  } else if (H.ph === "buzz" && H.lock === pid){
    const c = d.c | 0; if (c < 0 || c > 3) return;
    if (c === H.c){ H.res[pid] = { ok: true, p: 800, c }; addScore(pid, 800); H.lock = null; H.ph = "reveal"; SFX.ok(); changed(); sched(next, 6000); }
    else buzzWrong(pid, c);
  } else if (H.ph === "geo"){
    const lat = Number(d.lat), lon = Number(d.lon);
    if (H.answers[pid] || !isFinite(lat) || !isFinite(lon) || lat < 30 || lat > 75 || lon < -30 || lon > 50) return;
    H.answers[pid] = { lat: Math.round(lat * 1000) / 1000, lon: Math.round(lon * 1000) / 1000 }; changed();
    if (allAnswered()) fire();
  } else if (H.ph === "est"){
    const v = Number(d.v); if (H.answers[pid] || !isFinite(v)) return;

  }

function onBuzz(msg){

  lockBuzz(pid);

function onReact(msg){
  const pid = pidOf(msg.peer), d = msg.data || {};
  if (!pid || d.qid !== H.qid || H.answers[pid]) return;
  if (H.ph === "rwait"){ H.answers[pid] = { early: true }; SFX.bad(); changed(); }
  else if (H.ph === "rtrick"){ H.answers[pid] = { trick: true }; SFX.bad(); changed(); }
  else if (H.ph === "rgo"){
    if (d.early) H.answers[pid] = { early: true };
    else { const ms = Number(d.ms); if (!isFinite(ms)) return; H.answers[pid] = { ms: Math.round(Math.min(9999, Math.max(90, ms))) }; }
    changed(); if (allAnswered()) fire();
  }
}
function onTap(msg){

  if (introIdx < 0) return;

  for (const pid in H.scores) back[pid] = H.roundStart[pid] != null ? H.roundStart[pid] : 0;
  H.scores = back;
  clearTimeout(H.t); H.pending = null; H.pz = false; H.waiting = false; H.lock = null; H.restartArm = false;
  H.si = introIdx - 1;
  next();
}

}
// Häxan (aston) och Trollkarlen (leah) på kvast, egna figurer. r = 26 är normalstorlek.

  c.fillStyle = "#3B4FA8"; c.beginPath(); c.moveTo(-30, -11); c.lineTo(-40, -18); c.lineTo(-34, -6); c.closePath(); c.fill();

function drawBottle(c, b){
  const { w } = b.plugin, r = w / 2;
  c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
  const g = c.createRadialGradient(-r * .3, -r * .3, 2, 0, 0, r); g.addColorStop(0, "#FFF2A8"); g.addColorStop(.6, "#F2C230"); g.addColorStop(1, "#B8860B");
  c.fillStyle = g; c.strokeStyle = "#8A6508"; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
  c.strokeStyle = "rgba(138,101,8,.7)"; c.beginPath(); c.arc(0, 0, r * .72, 0, 7); c.stroke();
  c.fillStyle = "#8A6508"; c.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .22 : r * .5; c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
  c.closePath(); c.fill();
  c.restore();
}
function drawBlock(c, b){
  const P = b.plugin, { w, h } = P;
  c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
  if (P.kind === "wood"){ c.fillStyle = "#C98B4B"; c.strokeStyle = "#7A4E22"; }
  else if (P.kind === "glass"){ c.fillStyle = "rgba(185,225,255,.6)"; c.strokeStyle = "#5E98CC"; }
  else if (P.kind === "wall"){ c.fillStyle = "#B3594A"; c.strokeStyle = "#6E2E24"; }
  else { c.fillStyle = "#9097A3"; c.strokeStyle = "#5B616C"; }
  c.lineWidth = 3; c.fillRect(-w / 2, -h / 2, w, h); c.strokeRect(-w / 2 + 1.5, -h / 2 + 1.5, w - 3, h - 3);
  if (P.kind === "wood"){
    c.strokeStyle = "rgba(122,78,34,.45)"; c.lineWidth = 1.5;
    const long = w > h;
    for (let i = 1; i < 3; i++){ c.beginPath(); if (long){ c.moveTo(-w / 2 + 6, -h / 2 + i * h / 3); c.lineTo(w / 2 - 6, -h / 2 + i * h / 3); } else { c.moveTo(-w / 2 + i * w / 3, -h / 2 + 6); c.lineTo(-w / 2 + i * w / 3, h / 2 - 6); } c.stroke(); }
  } else if (P.kind === "glass"){
    c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = 3; c.beginPath(); c.moveTo(-w / 2 + 6, h / 2 - 8); c.lineTo(Math.min(w / 2 - 6, -w / 2 + 20), -h / 2 + 8); c.stroke();
  } else if (P.kind === "wall"){
    c.strokeStyle = "rgba(255,235,220,.55)"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-w / 2, 0); c.lineTo(w / 2, 0); c.moveTo(0, -h / 2); c.lineTo(0, 0); c.moveTo(-w / 4, 0); c.lineTo(-w / 4, h / 2); c.moveTo(w / 4, 0); c.lineTo(w / 4, h / 2); c.stroke();
  } else {
    c.fillStyle = "rgba(60,64,72,.35)";
    for (let i = 0; i < 5; i++){ c.beginPath(); c.arc(((i * 37) % w) - w / 2 + 6, ((i * 53) % h) - h / 2 + 6, 3, 0, 7); c.fill(); }
  }
  if (P.hp < P.max * .6){
    c.strokeStyle = "rgba(30,20,10,.7)"; c.lineWidth = 2; c.beginPath();
    c.moveTo(-w * .3, -h * .4); c.lineTo(0, -h * .05); c.lineTo(-w * .1, h * .15); c.lineTo(w * .25, h * .4); c.stroke();
  }
  c.restore();
}

/* --- fysik --- */
function slBuild(){
  const M = Matter;
  const E = SL.engine = M.Engine.create({ enableSleeping: true });
  E.gravity.y = 1;
  M.Composite.add(E.world, M.Bodies.rectangle(SLW / 2, GY + 60, SLW * 3, 120, { isStatic: true, label: "ground", friction: .9 }));
  SL.bodies = []; SL.rm = []; SL.parts = []; SL.texts = []; SL.proj = null;
  const caps = ["#FF5DA2", "#45C8FF", "#FFB020", "#9BE23B"]; let ci = 0;
  const box = (kind, cx, bottom, w, h) => {
    const K = KINDS[kind];
    const b = M.Bodies.rectangle(cx, bottom - h / 2, w, h, { density: K.density, friction: .7, restitution: .08, label: kind });
    b.plugin = { kind, hp: K.hp, max: K.hp, pts: K.pts, w, h, cap: kind === "bottle" ? caps[ci++ % 4] : null };
    M.Composite.add(E.world, b); SL.bodies.push(b);
  };
  bigWall = () => { for (let k = 0; k < 4; k++) box("wall", 760, GY - k * 78, 64, 78); };
  LEVELS[SL.level % LEVELS.length](box, (x, bottom) => box("bottle", x, bottom, 36, 36));
  SL.armed = false;
  for (let i = 0; i < 90; i++) M.Engine.update(E, 1000 / 60);
  M.Events.on(E, "collisionStart", slCollide);
  M.Events.on(E, "beforeUpdate", slBefore);
}
function slCollide(ev){
  if (!SL.armed) return;
  for (const pr of ev.pairs){
    const a = pr.bodyA.parent, b = pr.bodyB.parent;
    if (SL.proj && (a === SL.proj || b === SL.proj) && SL.who === "josef" && !SL.exploded){ slExplode(); continue; }
    const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    slHit(a, b, rv); slHit(b, a, rv);
  }
}
function slHit(t, other, rv){
  const P = t.plugin; if (!P || !P.kind || P.dead) return;
  let dmg = rv * (other === SL.proj ? 1.8 : 1);
  if (P.kind === "wall") dmg *= other === SL.proj ? .25 : .5;
  if (P.kind === "bottle" && other === SL.proj && rv > .6) dmg = 99;
  if (dmg < 1.2) return;
  P.hp -= dmg;
  if (P.hp <= 0) slBreak(t);
}
function slBreak(b){
  const P = b.plugin; if (P.dead) return; P.dead = true;
  SL.rm.push(b); SL.score += P.pts;
  const { x, y } = b.position;
  const col = P.kind === "wood" ? "#C98B4B" : P.kind === "glass" ? "#BFE3FF" : P.kind === "stone" ? "#9097A3" : "#F2DFAE";
  const n = P.kind === "bottle" ? 18 : 8;
  for (let i = 0; i < n; i++) SL.parts.push({ x, y, vx: (Math.random() - .5) * 10, vy: -Math.random() * 9, life: 50 + Math.random() * 30, col, s: P.kind === "bottle" ? 7 : 9, round: P.kind === "bottle" });
  if (P.kind === "bottle"){ SL.texts.push({ x, y: y - 40, t: "Guld! +1500", life: 90, col: "#E8213B", size: 40 }); SFX.pop(); }
  else SL.texts.push({ x, y: y - 20, t: "+" + P.pts, life: 50, col: "#22123F", size: 26 });
}
function slExplode(){
  const p = SL.proj; if (!p || SL.exploded) return;
  SL.exploded = true; SFX.boom();
  const pos = { x: p.position.x, y: p.position.y }, R = 200;
  for (const b of SL.bodies){
    if (b.plugin.dead) continue;
    const dx = b.position.x - pos.x, dy = b.position.y - pos.y, d = Math.hypot(dx, dy);
    if (d > R) continue;
    const f = 1 - d / R, k = 15 * f / Math.max(1, Math.sqrt(b.mass / 1.5));
    Matter.Sleeping.set(b, false);
    Matter.Body.setVelocity(b, { x: b.velocity.x + dx / (d || 1) * k, y: b.velocity.y + dy / (d || 1) * k - 3 * f });
    b.plugin.hp -= 10 + 32 * f;
    if (b.plugin.hp <= 0) slBreak(b);
  }
  SL.rm.push(p); SL.proj = null;
  const cols = ["#2F6BFF", "#FF8A1F", "#15A85C", "#FFD21F", "#FF5DA2", "#FFFFFF"];
  for (let i = 0; i < 60; i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 12; SL.parts.push({ x: pos.x, y: pos.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: 60 + Math.random() * 40, col: cols[i % cols.length], s: 8, confetti: true }); }
  SL.texts.push({ x: pos.x, y: pos.y - 30, t: "BOOM!", life: 70, col: "#FF8A1F", size: 80 });
}
function slBefore(){
  const p = SL.proj, E = SL.engine;
  if (p && SL.who === "josef" && !SL.exploded){
    p.force.y -= p.mass * E.gravity.y * E.gravity.scale * .88;
    Matter.Body.setAngle(p, Math.atan2(p.velocity.y, p.velocity.x)); Matter.Body.setAngularVelocity(p, 0);
    if (Math.random() < .8) SL.parts.push({ x: p.position.x - Math.cos(p.angle) * 40, y: p.position.y - Math.sin(p.angle) * 40, vx: -p.velocity.x * .2 + (Math.random() - .5) * 2, vy: -p.velocity.y * .2 + (Math.random() - .5) * 2, life: 22, col: Math.random() < .5 ? "#FFB020" : "#FF6B4A", s: 10, round: true, nograv: true });
  }
}
function slLaunch(a, pw){
  const M = Matter; let body, speed;
  if (SL.who === "josef"){ body = M.Bodies.rectangle(SX, SY, 70, 24, { density: .004, frictionAir: .002, label: "proj" }); speed = 10 + 12 * pw; }
  else { body = M.Bodies.rectangle(SX, SY, 86, 52, { chamfer: { radius: 10 }, density: .003, restitution: .3, friction: .6, frictionAir: .006, label: "proj" }); speed = 5 + 15 * pw; }
  M.Composite.add(SL.engine.world, body);
  M.Body.setVelocity(body, { x: Math.cos(a) * speed, y: -Math.sin(a) * speed });
  if (SL.who !== "josef") M.Body.setAngularVelocity(body, .15);
  SL.proj = body; SL.armed = true; SL.exploded = false; SL.flyStart = performance.now();
  SFX.launch();
}
function slLoop(){
  if (H.ph !== "sling"){ SL.raf = 0; return; }
  if (SL.engine){
    Matter.Engine.update(SL.engine, 1000 / 60);
    if (SL.rm.length){ for (const b of SL.rm){ Matter.Composite.remove(SL.engine.world, b); } SL.bodies = SL.bodies.filter(b => !b.plugin.dead); SL.rm = []; }
    const p = SL.proj;
    if (p && (p.position.x > SLW + 150 || p.position.x < -150 || p.position.y > SLH + 150)){ Matter.Composite.remove(SL.engine.world, p); SL.proj = null; }
  }

  SL.raf = requestAnimationFrame(slLoop);

function slDraw(){

  });
  // skott / sikte

function slCheck(){
  const el = performance.now() - SL.flyStart;

/* --- telefonens slangbella --- */
function slingPad(st, S){
  const usedW = S.u || [], left = CHARS.filter(w => !usedW.includes(w));
  if (PL.picked[st.qid] && usedW.includes(PL.picked[st.qid])) delete PL.picked[st.qid];
  if (left.length === 1 && !PL.picked[st.qid]){ PL.picked[st.qid] = left[0]; emitP("pick", { qid: st.qid, w: left[0] }); }
  if (!PL.picked[st.qid]) return slingPicker(st, S);
  const who = PL.picked[st.qid];
  const cv = h("canvas", { width: 600, height: 560, "aria-label": "Dra bakåt och släpp" }), ctx = cv.getContext("2d");
  const pad = h("div", { class: "slpad" }, cv);
  const C = { x: 300, y: 250 }, MAXP = 200;
  let s0 = null, pull = { x: 0, y: 0 }, last = 0;
  const qid = st.qid;
  const angleOf = () => Math.atan2(pull.y, -pull.x);
  const power = () => Math.min(1, Math.hypot(pull.x, pull.y) / MAXP);
  const draw = () => {
    ctx.clearRect(0, 0, 600, 560);
    ctx.lineCap = "round"; ctx.strokeStyle = "#7A4E22"; ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(300, 560); ctx.lineTo(300, 380); ctx.lineTo(245, 280); ctx.moveTo(300, 380); ctx.lineTo(355, 280); ctx.stroke();
    const len = Math.hypot(pull.x, pull.y), px = C.x + pull.x, py = C.y + pull.y;
    if (len > 12){
      ctx.fillStyle = "rgba(140,110,220,.85)";
      for (let i = 1; i <= 6; i++){ const k = i * 40 * (.5 + len / MAXP); ctx.beginPath(); ctx.arc(C.x - pull.x / len * k, C.y - pull.y / len * k, 9 - i, 0, 7); ctx.fill(); }
    }
    ctx.strokeStyle = "#3A2410"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(245, 280); ctx.lineTo(px, py); ctx.lineTo(355, 280); ctx.stroke();
    if (who === "josef") drawJosef(ctx, px, py, Math.atan2(-pull.y, -pull.x || 1), 1.8); else drawBaby(ctx, px, py, 46, 0, who);
    ctx.fillStyle = "#8C7BB0"; ctx.font = "700 28px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(len > 12 ? `Kraft ${Math.round(power() * 100)} %` : "Dra bakåt och släpp", 300, 50);
  };
  const toPull = e => {
    const r = cv.getBoundingClientRect(), k = 600 / r.width;
    let x = (e.clientX - s0.x) * k, y = (e.clientY - s0.y) * k;
    const l = Math.hypot(x, y); if (l > MAXP){ x *= MAXP / l; y *= MAXP / l; }
    pull = { x, y };
  };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(_){} s0 = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener("pointermove", e => {
    if (!s0) return; toPull(e); draw();
    const now = Date.now(); if (now - last > 100){ last = now; emitP("aim", { qid, a: angleOf(), p: power() }); }
  });
  const release = e => {
    if (!s0) return; toPull(e); s0 = null;
    if (power() > .12){ PL.fired[qid] = true; vibrate(60); emitP("fire", { qid, a: angleOf(), p: power(), w: who }); phRender(); }
    else { pull = { x: 0, y: 0 }; draw(); emitP("aim", { qid, a: .5, p: 0 }); }
  };
  cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", () => { s0 = null; pull = { x: 0, y: 0 }; draw(); });
  draw();
  return [
    h("div", { class: "slhead" },
      h("span", null, `Skott ${S.n + 1} av 3: ${CHAR_NAME[who]}`),
      left.length > 1 ? h("button", { class: "btn ghost", onclick: () => { delete PL.picked[qid]; phRender(true); } }, "Byt figur") : null),
    miniBar(PL.deadline, st.dur),
    pad,
    h("p", { class: "ph-text muted", style: "text-align:center; font-size:.95rem" }, who === "josef"
      ? "Dra bakåt och släpp. Fyrverkeriet flyger rakt som en raket och exploderar när det träffar något. Tryck på Spräng för att smälla tidigare."
      : "Dra bakåt och släpp. Ju längre du drar, desto hårdare skott. Träffa guldmynten för mest poäng!")
  ];
}

function racePad(st){

  }

  const pad = h("div", { class: "flypad", role: "button", tabindex: "0" }, cv, h("span", { class: "runhint" }, "Tryck med två fingrar växelvis!"));

  const clouds = Array.from({ length: 14 }, () => ({ x: (Math.random() - .5) * 8, y: .4 + Math.random() * 2.4, z: 1 + Math.random() * 12 }));
  const step = k => {
    if (PL.rDone) return;
    const now = performance.now();
    for (let i = 0; i < k; i++){ PL.rtaps++; PL.rTimes.push(now); }

    }
    // moln
    for (const cl of clouds){
      cl.z -= speed * dt * 6; if (cl.z < .3){ cl.z = 10 + Math.random() * 4; cl.x = (Math.random() - .5) * 8; cl.y = .4 + Math.random() * 2.4; }
      const sx = W / 2 + cl.x / cl.z * f, sy = hy - cl.y / cl.z * f, r = 46 / cl.z * 3;
      if (sy < -r || sy > hy + r) continue;

    if (speed > .6) for (let i = 0; i < 10; i++){
      const a = (i / 10) * Math.PI * 2 + now / 300, r1 = 160 + (now / 3 + i * 50) % 140;

      ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r1, hy + Math.sin(a) * r1 * .7); ctx.lineTo(W / 2 + Math.cos(a) * (r1 + 40), hy + Math.sin(a) * (r1 + 40) * .7); ctx.stroke();
    }
    // kvasten bakifrån: skaftet pekar mot horisonten, riset närmast kameran
    const bob = Math.sin(now / 180) * (4 + speed * 4), bx = W / 2, by = Hh - 150 + bob;
    ctx.fillStyle = "#8B5A2B"; ctx.beginPath(); ctx.moveTo(bx - 9, by); ctx.lineTo(bx + 9, by); ctx.lineTo(bx + 2, hy + 70); ctx.lineTo(bx - 2, hy + 70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#E3B65A"; ctx.strokeStyle = "#A9802F"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx - 12, by - 6); ctx.lineTo(bx - 70, by + 120); ctx.lineTo(bx + 70, by + 120); ctx.lineTo(bx + 12, by - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    for (let i = -3; i <= 3; i++){ ctx.beginPath(); ctx.moveTo(bx + i * 3, by); ctx.lineTo(bx + i * 20, by + 118); ctx.stroke(); }
    // figuren på kvasten

    ctx.beginPath(); ctx.arc(bx, by - 92, 52, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
    ctx.font = "64px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

  pad.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); step(1); } });
  return pad;
}

        return [h("p", { class: "ph-text", style: "font-weight:800; text-align:center" }, "Du var först! Välj svar"), miniBar(PL.lockDeadline, 7000),
          h("div", { class: "answers" }, (st.o || []).map((t, i) => h("button", { class: `ans c${i}${sent ? (PL.my["b" + st.qid] === i ? " picked" : " faded") : ""}`, disabled: sent, onclick: () => { if (PL.my["b" + st.qid] != null) return; PL.my["b" + st.qid] = i; vibrate(30); emitP("answer", { qid: st.qid, c: i }); phRender(); } }, h("span", { class: "shape" }, SHAPES[i]), h("span", null, t))))];
      }
      if (st.lock){ const m = nameOfPid(st.lock); return waitView(`${m ? m.emoji + " " + m.name : "Någon"} buzzade först`, "Om svaret blir fel kan du buzza igen."); }
      return [h("p", { class: "ph-text", style: "text-align:center" }, st.q || ""), h("button", { class: "buzzer", onclick: () => { vibrate(60); emitP("buzz", { qid: st.qid }); } }, "BUZZ")];
    }
    case "rtrick": {
      if (PL.early[st.qid]) return resultView("bad", "Tjuvstart!", "Du tryckte för tidigt. Noll poäng den här gången.");
      if (PL.tricked[st.qid] || (st.ans || []).includes(pid)) return resultView("bad", "HAHA GOT YOU!", "Det var ju inte den gröna! Minus 300 poäng.");
      return h("button", { class: "full trickbtn", onpointerdown: e => { e.preventDefault(); PL.tricked[st.qid] = true; vibrate(300); emitP("react", { qid: st.qid, ms: 0 }); phRender(); } }, trickArt("trickimg"));
    }
    case "rtrickr": return r && r.trick ? resultView("bad", "HAHA GOT YOU!", "Det var ju inte den gröna! Minus 300 poäng.") : resultView("ok", "Snyggt!", "Du gick inte på det.");
    case "rwait": {
      if (PL.early[st.qid] || (st.ans || []).includes(pid)) return resultView("bad", "Tjuvstart!", "Du tryckte för tidigt. Noll poäng den här gången.");
      return h("button", { class: "full wait", onpointerdown: e => { e.preventDefault(); PL.early[st.qid] = true; vibrate(200); emitP("react", { qid: st.qid, early: true }); phRender(); } }, h("div", null, "Vänta…", h("small", null, "Tryck när det blir grönt")));
    }
    case "rgo": {
      if (PL.early[st.qid]) return resultView("bad", "Tjuvstart!", "Du tryckte för tidigt. Noll poäng den här gången.");
      if (PL.rms[st.qid] != null) return resultView("none", `${fmt(PL.rms[st.qid])} ms`, "Snyggt! Titta på TV:n.");
      return h("button", { class: "full go", onpointerdown: e => { e.preventDefault(); if (PL.rms[st.qid] != null) return; const ms = Math.round(performance.now() - (PL.goAt[st.qid] || performance.now())); PL.rms[st.qid] = ms; vibrate(40); emitP("react", { qid: st.qid, ms }); phRender(); } }, h("div", null, "TRYCK!"));
    }
    case "rres": {
      if (!r) return resultView("none", "Ingen tid", "Du hann inte trycka.");
      return r.early ? resultView("bad", "Tjuvstart", "Noll poäng.") : resultView("ok", `${fmt(r.ms)} ms`, `+${r.p} poäng`);
    }
    case "est": {
      const mine = PL.my[st.qid];
      if (mine != null || (st.ans || []).includes(pid)) return [miniBar(PL.deadline, st.dur), waitView("Gissning skickad", mine != null ? `Du gissade ${String(mine).replace(".", ",")}${st.u ? " " + st.u : ""}.` : "")];
      const inp = h("input", { type: "text", inputmode: "decimal", autocomplete: "off", placeholder: "Din gissning", "aria-label": "Din gissning" });
      const send = () => { const v = Number(String(inp.value).replace(/\s/g, "").replace(",", ".")); if (!isFinite(v) || inp.value.trim() === ""){ inp.focus(); return; } PL.my[st.qid] = v; vibrate(30); emitP("answer", { qid: st.qid, v }); phRender(); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
      return [miniBar(PL.deadline, st.dur), h("p", { class: "ph-text", style: "font-weight:700; font-size:1.25rem" }, st.q || ""), st.u ? h("p", { class: "ph-text muted" }, `Svara i ${st.u}`) : null,
        h("div", { class: "estin field" }, inp, h("button", { class: "btn", onclick: send }, "Skicka"))];
    }
    case "estr": {
      const ans = st.u === "" ? String(st.a) : fmt(st.a);
      if (!r) return resultView("none", ans, "Rätt svar. Du hann inte gissa.");
      return resultView(r.d === 0 ? "ok" : "none", ans, `Rätt svar${st.u ? " i " + st.u : ""}. Du gissade ${String(r.v).replace(".", ",")}: +${fmt(r.p)} poäng`);
    }
    case "geo": {
      const mine = PL.my[st.qid];
      if (mine || (st.ans || []).includes(pid)){
        const G = PL.geo && PL.geo.qid === st.qid ? PL.geo : null;
        const svg = baseMap(G ? G.vb : null);
        if (mine){ const p = projXY(mine.lat, mine.lon), w = G ? G.vb.w : MW; svg.append(pinEl(p.x, p.y, w * .028, PL.me.color, PL.me.emoji, "pin nopop")); }
        return [miniBar(PL.deadline, st.dur), h("h2", { class: "ph-title", style: "text-align:center" }, "Flaggan är satt"), h("p", { class: "ph-text", style: "text-align:center" }, "Väntar på de andra. Ingen kan se var du har satt den."), h("div", { class: "phmap" }, svg)];
      }
      return geoPicker(st);
    }
    case "geor": {
      const look = id => (id === pid ? PL.me : nameOfPid(id)) || { color: "#888888", emoji: "🙂" };
      const map = h("div", { class: "phmap" }, revealMap({ lat: st.glat, lon: st.glon }, st.res, look));
      if (!r) return [resultView("none", "Ingen flagga", `Så här ligger ${st.q || "platsen"}.`), map];
      return [resultView(r.km <= 25 ? "ok" : "none", kmText(r.km), `från ${st.q || "rätt plats"}: +${fmt(r.p)} poäng`), map];
    }
    case "raceready": return waitView("Upp på kvasten…", "Gör dig redo att trycka så snabbt du kan!", h("div", { class: "bignum", style: "font-size:96px", "data-dl": PL.deadline, "data-dur": st.dur }));
    case "race": return racePad(st);
    case "racer": {
      if (!r) return resultView("none", "Inget lopp", "Du hann inte springa den här gången.");
      return resultView(r.place === 1 ? "ok" : "none", r.place === 1 ? "Du vann! 🥇" : `Plats ${r.place}`, `${r.ms ? "Tid " + (r.ms / 1000).toFixed(2).replace(".", ",") + " s. " + (r.ms <= RACE_RECORD ? "Nytt världsrekord! " : "") : ""}+${fmt(r.p)} poäng`);
    }
    case "tower": {
      const T = st.tw || {}, mine = T.p && T.p[pid];
      if (!mine) return waitView("Tornbygget pågår", "Du kom in mitt i ronden. Heja på de andra!");
      return towerPad(st, T, mine);
    }
    case "towerr":
      if (r && r.out) return resultView(r.p ? "ok" : "bad", "Utslagen", r.p ? `Men ${r.inT} av dina ${r.tot} bitar låg i tornet: +${fmt(r.p)} poäng` : "Du fick 0 poäng i Tornbygget.");
      return r && r.ok ? resultView("ok", "Ni klarade det!", `+${fmt(r.p)} poäng: pott ${fmt(r.pot)} + bonus ${fmt(r.bonus)} för ${r.inT} av ${r.tot} ${r.tot === 1 ? "bit" : "bitar"} i tornet`) : resultView("bad", "Tornet blev inte klart", "Ingen poäng den här gången");
    case "sling": {
      const S = st.sl || {};
      if (S.t !== pid){
        const m = nameOfPid(S.t), pos = (S.q || []).indexOf(pid);
        const txt = pos === 1 ? "Du är näst på tur. Gör dig redo!" : pos > 1 ? `${pos - 1} ${pos - 1 === 1 ? "spelare" : "spelare"} före dig i kön.` : "Titta på TV:n!";
        return waitView(`${m ? m.emoji + " " + m.name : "Någon"} skjuter`, txt);
      }
      if (S.s === "done") return resultView("ok", `${fmt(S.sc || 0)} poäng`, "Snyggt skjutet! Titta på TV:n.");
      if (S.s === "fly" || PL.fired[st.qid]){
        if (S.w === "josef") return [h("p", { class: "ph-text", style: "text-align:center; font-weight:700" }, "Tryck för att spränga fyrverkeriet"), h("button", { class: "buzzer", onclick: () => { vibrate(120); emitP("boom", { qid: st.qid }); } }, "SPRÄNG!")];
        return waitView("Iväg!", `${CHAR_NAME[S.w]} flyger. Titta på TV:n.`);
      }
      return slingPad(st, S);
    }
    case "slingr": return r ? resultView(r.p ? "ok" : "none", `${fmt(r.n)} poäng`, r.p ? `+${r.p} i quizet` : "") : resultView("none", "Ingen tur den här gången", "");
    case "tapready": return waitView("Gör dig redo", "Tryck så snabbt du kan när knappen dyker upp.", h("div", { class: "bignum", style: "font-size:96px", "data-dl": PL.deadline, "data-dur": st.dur }));
    case "tap": {
      if (PL.tapDone) return resultView("none", `${PL.taps} tryck`, "Tiden är ute. Titta på TV:n.");
      return h("button", { class: "full tapper", onpointerdown: e => { e.preventDefault(); if (Date.now() < PL.deadline && !PL.tapDone){ PL.taps++; const n = document.getElementById("tapn"); if (n) n.textContent = PL.taps; } } }, h("div", null, h("span", { id: "tapn" }, PL.taps), h("small", null, "Tryck!")));
    }
    case "tapr": return r ? resultView("ok", `${r.n} tryck`, `+${r.p} poäng`) : resultView("none", "Inga tryck", "");
    case "scores": { const [rk, of] = myRank(); return waitView(`Plats ${rk} av ${of}`, `Du har ${fmt(myScore())} poäng efter rond ${st.rn}.`); }
    case "end": { const [rk, of] = myRank(); return waitView(rk === 1 ? "Du vann! 🏆" : `Plats ${rk} av ${of}`, `Slutpoäng: ${fmt(myScore())}`); }
  }
  return waitView("Titta på TV:n", "");
}
function geoPicker(st){
  let G = PL.geo;
  if (!G || G.qid !== st.qid) G = PL.geo = { qid: st.qid, vb: { x: 0, y: 0, w: MW, h: MH }, pin: null };
  const svg = baseMap(G.vb), pinG = S("g");
  svg.append(pinG);
  const btn = h("button", { class: "btn", style: "font-size:1.15rem; padding:.8em", onclick: () => {
    if (!G.pin || PL.my[st.qid]) return;
    const ll = unproj(G.pin.x, G.pin.y);
    PL.my[st.qid] = { lat: Math.round(ll.lat * 1000) / 1000, lon: Math.round(ll.lon * 1000) / 1000 };
    vibrate(40); emitP("answer", { qid: st.qid, lat: PL.my[st.qid].lat, lon: PL.my[st.qid].lon }); phRender();
  } }, "Sätt flaggan här");
  const draw = () => {
    svg.setAttribute("viewBox", `${G.vb.x} ${G.vb.y} ${G.vb.w} ${G.vb.h}`);
    pinG.replaceChildren();
    if (G.pin) pinG.append(pinEl(G.pin.x, G.pin.y, G.vb.w * .028, PL.me.color, PL.me.emoji, "pin nopop"));
    btn.disabled = !G.pin;
  };
  const clamp = () => {
    G.vb.w = Math.min(MW, Math.max(60, G.vb.w)); G.vb.h = G.vb.w * MH / MW;
    G.vb.x = Math.min(MW - G.vb.w, Math.max(0, G.vb.x)); G.vb.y = Math.min(MH - G.vb.h, Math.max(0, G.vb.y));
  };
  const zoomAt = (f, cx, cy) => {
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    const u = G.vb.w / r.width, px = G.vb.x + (cx - r.left) * u, py = G.vb.y + (cy - r.top) * u;
    G.vb.w = G.vb.w / f; clamp();
    const u2 = G.vb.w / r.width; G.vb.x = px - (cx - r.left) * u2; G.vb.y = py - (cy - r.top) * u2; clamp(); draw();
  };
  const ptrs = new Map(); let s0 = null, moved = false, pz = null;
  svg.addEventListener("pointerdown", e => {
    e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch(_){}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1){ s0 = { x: e.clientX, y: e.clientY, vb: { ...G.vb } }; moved = false; }
    else if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pz = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, vb: { ...G.vb } }; moved = true; }
  });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    if (ptrs.size >= 2 && pz){
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const u0 = pz.vb.w / r.width, px = pz.vb.x + (pz.mx - r.left) * u0, py = pz.vb.y + (pz.my - r.top) * u0;
      G.vb.w = pz.vb.w * pz.d / d; clamp();
      const u = G.vb.w / r.width, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      G.vb.x = px - (mx - r.left) * u; G.vb.y = py - (my - r.top) * u; clamp(); draw();
    } else if (s0){
      const dx = e.clientX - s0.x, dy = e.clientY - s0.y;
      if (!moved && Math.hypot(dx, dy) > 8) moved = true;
      if (moved){ const u = s0.vb.w / r.width; G.vb.x = s0.vb.x - dx * u; G.vb.y = s0.vb.y - dy * u; clamp(); draw(); }
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0){
      if (!moved && s0 && e.type === "pointerup"){
        const r = svg.getBoundingClientRect(), u = G.vb.w / r.width;
        G.pin = { x: G.vb.x + (e.clientX - r.left) * u, y: G.vb.y + (e.clientY - r.top) * u }; vibrate(15); draw();
      }
      s0 = null; pz = null;
    } else if (ptrs.size === 1){ const [q] = [...ptrs.values()]; s0 = { x: q.x, y: q.y, vb: { ...G.vb } }; pz = null; moved = true; }
  };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : .8, e.clientX, e.clientY); }, { passive: false });
  const center = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.left + r.width / 2, r.top + r.height / 2); };
  draw();
  return [
    h("p", { class: "ph-text", style: "font-weight:800; font-size:1.35rem; text-align:center" }, `Var ligger ${st.q || ""}?`),
    miniBar(PL.deadline, st.dur),
    h("div", { class: "phmap" }, svg, h("div", { class: "zoom" },
      h("button", { "aria-label": "Zooma in", onclick: () => center(1.6) }, "+"),
      h("button", { "aria-label": "Zooma ut", onclick: () => center(1 / 1.6) }, "−"))),
    h("p", { class: "ph-text muted", style: "text-align:center; font-size:.95rem" }, "Zooma med två fingrar eller med plus. Tryck på kartan för att placera flaggan."),
    btn
  ];
}
function startTapRace(qid){
  PL.tapQid = qid; PL.taps = 0; PL.tapDone = false; PL.tapSent = 0;
  clearInterval(PL.tapIv);
  PL.tapIv = setInterval(() => {
    const over = Date.now() >= PL.deadline;
    if (PL.taps !== PL.tapSent || over){ PL.tapSent = PL.taps; emitP("tap", { qid, n: PL.taps }); }
    if (over){ clearInterval(PL.tapIv); PL.tapDone = true; phRender(); }
  }, 350);
}
function hostStrip(){
  const st = PL.st || {};
  const send = a => { vibrate(20); emitP("ctl", { a }); };
  if (!st.ph) return null;
  if (st.ph === "lobby") return h("div", { class: "host" }, h("span", null, "Värd"), h("button", { class: "btn", onclick: () => send("start") }, "Starta spelet"));
  if (st.ph === "end") return h("div", { class: "host" }, h("span", null, "Värd"), h("button", { class: "btn", onclick: () => send("again") }, "Spela igen"));
  const rb = h("button", { class: "btn ghost", onclick: () => {
    if (rb.dataset.arm){ delete rb.dataset.arm; send("restart"); rb.textContent = "Börja om"; return; }
    rb.dataset.arm = "1"; rb.textContent = "Säker?"; setTimeout(() => { if (rb.dataset.arm){ delete rb.dataset.arm; rb.textContent = "Börja om"; } }, 4000);
  } }, "Börja om");
  return h("div", { class: "host" }, h("span", null, "Värd"),
    h("button", { class: "btn ghost", onclick: () => send("pause") }, st.pz ? "Fortsätt" : "Pausa"),
    rb,
    h("button", { class: "btn", onclick: () => send("skip") }, "Hoppa vidare"));
}

route();
</script>
